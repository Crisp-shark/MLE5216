kinetic energy."},{"id":"C","text":"Allow for finite pulse-processing time, during which some additional events cannot be processed normally."},{"id":"D","text":"Assume the specimen stops emitting X-rays whenever the detector is processing a pulse."}],"answers":["A","C"],"explanation":"C 正确：处理一次事件需要时间，处理期间的额外事件可能丢失或堆积。\nD 错误：死时间属于探测器读出限制，不表示样品停止产生X射线。\nA 正确：减少单位时间的入射电子及光子数可降低事件重叠概率。\nB 错误：束流控制到达数量，不等同于提高单电子动能，也不能消除有限处理时间。\n\n重点词：dead time（死时间）；count rate（计数率）；pile-up（脉冲堆积）。\n逻辑链：事件到达过快 → 前一脉冲尚未处理完 → 丢计数或错误合并 → 合理降低束流以改善有效采集。","source":{"file":"Electron Spectroscopy","page":"PDF pp. 31, 40"},"difficulty":"进阶"},{"id":"SPEC-012","chapter":"Electron Spectroscopy","type":"multiple","prompt":"Which detector-design choices improve reliable EDS signal collection?","options":[{"id":"A","text":"A thin window helps maintain the appropriate vacuum near the silicon crystal and prevent ice formation."},{"id":"B","text":"A suitable detector position and collection angle can increase the number of X-rays collected from the sample."},{"id":"C","text":"Cooling reduces thermal noise; either liquid-nitrogen or Peltier cooling can serve this purpose."},{"id":"D","text":"Moving the detector closer changes the specimen’s core-level transition energies."}],"answers":["A","B","C"],"explanation":"A 正确：课件把薄窗与晶体处的良好真空、防结冰联系起来。\nC 正确：冷却降低热噪声，两种冷却方式都体现这一目的，而非改变元素能级。\nB 正确：收集几何决定能接受多少出射光子，影响信号效率。\nD 错误：位置改变收集条件，不改变样品原子内层能级差。\n\n重点词：thermal noise（热噪声）；collection angle（收集角）；detector window（探测器窗口）。\n逻辑链：稳定晶体环境并冷却 → 降低结冰和噪声影响；合理收集几何 → 接收更多有用光子 → 改善测量质量。","source":{"file":"Electron Spectroscopy","page":"PDF pp. 32, 33"},"difficulty":"基础"},{"id":"SPEC-013","chapter":"Electron Spectroscopy","type":"multiple","prompt":"A quick elemental survey is needed, but a later measurement must separate closely spaced X-ray lines. Which comparison is appropriate?","options":[{"id":"A","text":"EDS usually has higher spectral resolving power than WDS, so WDS is useful mainly for faster broad surveys."},{"id":"B","text":"Once WDS resolves a line, neither standards nor intensity corrections are needed for quantitative composition."},{"id":"C","text":"EDS is convenient for a quick broad spectrum, while WDS can offer better line separation at the cost of slower acquisition and more demanding operation and height control."},{"id":"D","text":"Narrower WDS peaks automatically imply a smaller spatial interaction volume in the specimen."}],"answers":["C"],"explanation":"A 错误：课件的相对优势相反：EDS快而方便，WDS谱分辨能力更高。\nC 正确：WDS顺序选波及几何要求带来速度、操作和样品高度等取舍，课件也列出其标样要求。\nD 错误：谱分辨率描述能量/波长轴分离能力，不是样品空间采样范围。\nB 错误：分开谱线不等于完成定量，课件仍列出WDS的标样要求，响应及吸收等强度校正也不能省略。\n\n重点词：spectral resolution（谱分辨率）；parallel acquisition（并行采集）；standards（标样）。\n逻辑链：快速多元素概览 → 选方便的EDS；相近线难分 → 考虑高谱分辨WDS → 同时接受速度、几何与定量要求的代价。","source":{"file":"Electron Spectroscopy","page":"PDF pp. 26, 34–37; STEM PDF p. 2"},"difficulty":"进阶"},{"id":"SPEC-014","chapter":"Electron Spectroscopy","type":"multiple","prompt":"Which statements describe how WDS selects and records X-rays?","options":[{"id":"A","text":"The detector and monochromator geometry can be ignored when the selected wavelength is changed."},{"id":"B","text":"A crystal selects wavelengths through the Bragg condition, so changing the crystal–detector geometry changes the accepted wavelength."},{"id":"C","text":"Counting at one fixed selected wavelength records the entire broad spectrum in parallel."},{"id":"D","text":"Different crystal spacings and multiple channels can extend the accessible lines and improve acquisition efficiency."}],"answers":["B","D"],"explanation":"B 正确：晶体衍射满足布拉格条件，Rowland圆上的几何配合使选定波长到达探测器。\nC 错误：一个固定波长只贡献一个谱点，需继续改变选波条件才得到其他位置。\nD 正确：不同晶体和多通道可覆盖不同线系并提高效率，但不改变基本选波逻辑。\nA 错误：选波与几何本来就相互关联，不能把WDS当作与角度无关的全谱读出。\n\n重点词：Bragg condition（布拉格条件）；monochromator（单色器）；sequential acquisition（顺序采集）。\n逻辑链：选择晶体及衍射角 → 仅相应波长被有效选出 → 记录该谱点 → 改变几何继续扫描以形成光谱。","source":{"file":"Electron Spectroscopy","page":"PDF pp. 35, 36"},"difficulty":"基础"},{"id":"SPEC-015","chapter":"Electron Spectroscopy","type":"multiple","prompt":"A broad EDS feature may contain contributions from two elements. Which conclusions are justified?","options":[{"id":"A","text":"A higher spectral-resolution WDS measurement can help separate nearby line contributions."},{"id":"B","text":"Separating spectral lines proves that the two elements are spatially separated within the specimen."},{"id":"C","text":"A single broad feature proves that only one element is present in the sampled region."},{"id":"D","text":"After separating lines, peak assignment, background treatment and quantitative corrections still require attention."}],"answers":["A","D"],"explanation":"A 正确：课件的重叠谱对照展示WDS可改善相邻线的分离。\nC 错误：不同元素的线可能在EDS中混成一个宽峰。\nD 正确：分峰改善归属，不能代替其余处理和校正步骤。\nB 错误：能量轴上分开不等于空间上分开；可能来自同一个采样体积。\n\n重点词：overlapping peaks（重叠峰）；line separation（谱线分离）；spatial resolution（空间分辨率）。\n逻辑链：宽谱峰可能包含多条线 → 提高谱分辨能力帮助归属 → 再处理背景和响应 → 元素空间分布仍需合适的扫描与采样尺度。","source":{"file":"Electron Spectroscopy","page":"PDF pp. 22, 34, 37"},"difficulty":"进阶"},{"id":"SPEC-016","chapter":"Electron Spectroscopy","type":"multiple","prompt":"Which statements explain the value and limits of spectrum imaging?","options":[{"id":"A","text":"Combining elemental maps with morphology can distinguish filler-rich regions from the surrounding fibres or matrix."},{"id":"B","text":"A colour-coded elemental map by itself determines every chemical bond and ionic state."},{"id":"C","text":"Saving a spectrum at each scan position creates spatially indexed spectral data, not a direct depth reconstruction."},{"id":"D","text":"Selected elemental maps can be extracted after acquisition, and local spectra can be re-examined."}],"answers":["A","C","D"],"explanation":"C 正确：数据包含扫描位置和能谱坐标，第三轴是能量或波长，不是物理深度。\nD 正确：保存完整谱保留了后续选峰与核查局部信号的可能。\nA 正确：课件纸张例子将纤维与填料的元素分布联系起来，重点是信息互补而非记材料配方。\nB 错误：元素分布不等于全部键合或价态信息，后者可能需要EELS细结构等更合适信号。\n\n重点词：spectrum imaging（谱像）；data cube（数据立方体）；elemental distribution（元素分布）。\n逻辑链：逐点采集并保留完整能谱 → 选择元素信号并映射回位置 → 与形貌联合解读 → 不把元素图超解释为所有化学状态。","source":{"file":"Electron Spectroscopy","page":"PDF pp. 38, 39"},"difficulty":"进阶"},{"id":"SPEC-017","chapter":"Electron Spectroscopy","type":"multiple","prompt":"An extra high-energy EDS feature becomes much stronger when the count rate is increased. Which interpretations are reasonable?","options":[{"id":"A","text":"Changing current can alter pile-up probability without changing the elemental characteristic transition energies."},{"id":"B","text":"Nearly simultaneous photon events may be processed as one event carrying their combined energy."},{"id":"C","text":"An additional peak must represent a new impurity element rather than a detector artefact."},{"id":"D","text":"Lowering the beam current is a useful check for a pile-up-related sum feature."}],"answers":["A","B","D"],"explanation":"B 正确：两个脉冲未能被正常分开时，收集电荷可被错误合并成较高能量事件。\nD 正确：降低到达率可减少重叠；课件用不同束流的曲线展示这种诊断思路。\nC 错误：额外峰可能是和峰，不能一见新峰就添加新元素。\nA 正确：电流改变事件到达率，不改变元素内层能级差。\n\n重点词：sum peak（和峰）；pulse pile-up（脉冲堆积）；arrival rate（到达率）。\n逻辑链：光子到达过密 → 两事件在处理中重叠 → 被记成合并能量 → 改变计数率检查其变化，而非直接判为新元素。","source":{"file":"Electron Spectroscopy","page":"PDF pp. 40"},"difficulty":"进阶"},{"id":"SPEC-018","chapter":"Electron Spectroscopy","type":"multiple","prompt":"Which explanation correctly identifies an escape peak in a silicon EDS detector?","options":[{"id":"A","text":"The escape peak lies above its parent because escape adds energy to the detected event."},{"id":"B","text":"An escape peak and a sum peak are both caused by combining two incoming sample photons."},{"id":"C","text":"A silicon-related detector escape feature proves that silicon is present in the specimen."},{"id":"D","text":"An X-ray generated inside the detector can escape, leaving less energy deposited than in the original photon event."}],"answers":["D"],"explanation":"D 正确：部分能量以探测器内产生的X射线形式逸出，最终记录的沉积能量小于原光子能量。\nA 错误：能量离开而非加入探测事件，所以逃逸特征位于母峰较低能量一侧。\nB 错误：和峰是多个事件重叠，逃逸峰是一个事件未完全沉积能量，两者机制和方向不同。\nC 错误：这里的硅来自探测器晶体，不能据此认定样品含硅。\n\n重点词：escape peak（逃逸峰）；deposited energy（沉积能量）；detector artefact（探测伪影）。\n逻辑链：原光子进入硅晶体 → 部分能量再以X射线逸出 → 留在晶体中的能量减少 → 出现母峰低能侧的逃逸特征。","source":{"file":"Electron Spectroscopy","page":"PDF pp. 41"},"difficulty":"进阶"},{"id":"SPEC-019","chapter":"Electron Spectroscopy","type":"multiple","prompt":"Changing SEM beam energy alters an EDS measurement. Which consequences should be considered?","options":[{"id":"A","text":"The beam setting producing the best-looking SE image must also be sufficient for every desired EDS line."},{"id":"B","text":"Higher beam energy can enlarge the lateral X-ray-generation region and reduce spatial localization in a bulk sample."},{"id":"C","text":"Failure to observe a chosen line at low beam energy proves that the element is absent."},{"id":"D","text":"Higher beam energy can make a previously inaccessible high-energy characteristic line possible by satisfying its excitation requirement."}],"answers":["B","D"],"explanation":"D 正确：产生内层空穴需要足够入射能量；束能过低时，即使有该元素也可能激发不出所需线。\nC 错误：缺峰可能是激发条件不足，不能直接推出元素不存在。\nB 正确：较高束能同时可能增大相互作用体积，让相邻区域信号混入，因此存在取舍。\nA 错误：表面SE成像与内层X射线激发的最佳条件不必相同，不能只按图像漂亮程度选谱学束能。\n\n重点词：excitation threshold（激发阈值）；interaction volume（相互作用体积）；localization（局域性）。\n逻辑链：提高束能 → 更可能激发较深核心能级，同时电子传播更广 → 可测谱线增加但局部采样范围可能变大 → 按目标谱线与空间尺度共同选束能。","source":{"file":"Electron Spectroscopy","page":"PDF pp. 25, 42, 52; STEM PDF p. 6"},"difficulty":"进阶","tutorial":"Electron Spectroscopy Tutorial Q2"},{"id":"SPEC-020","chapter":"Electron Spectroscopy","type":"multiple","prompt":"Why is EELS normally associated with TEM or STEM rather than the conventional bulk-sample SEM described in the course?","options":[{"id":"A","text":"The conventional SEM geometry discussed uses thick specimens and does not provide the required transmitted-electron measurement path."},{"id":"B","text":"TEM and STEM can provide a transmitting specimen and an appropriate detector path below it."},{"id":"C","text":"EELS measures characteristic X-ray photons above the sample, so specimen transmission is irrelevant."},{"id":"D","text":"EELS analyses the energy lost by beam electrons transmitted through a sufficiently thin specimen."}],"answers":["A","B","D"],"explanation":"D 正确：EELS的被测对象是穿过样品后仍可检测的束电子及其能量损失。\nA 正确：本课常规SEM的厚样品及探测几何不提供这种下方透射路径，这是老师Tutorial的核心原因。\nB 正确：TEM/STEM的薄样品和透射电子光路与这一测量要求相符。\nC 错误：这把EELS与EDS/WDS的X射线探测混淆，忽略了真正需要的信号路径。\n\n重点词：transmission（透射）；energy loss（能量损失）；detector geometry（探测器几何）。\n逻辑链：EELS要测穿过样品的电子 → 样品必须足够透射并有下方光路 → TEM/STEM符合条件 → 不能仅在常规厚样品SEM上加一个X射线式探测器替代。","source":{"file":"Electron Spectroscopy","page":"PDF pp. 16, 43, 52; STEM PDF p. 5"},"difficulty":"基础","tutorial":"Electron Spectroscopy Tutorial Q1"},{"id":"SPEC-021","chapter":"Electron Spectroscopy","type":"multiple","prompt":"Which information can EELS provide beyond a simple list of elements?","options":[{"id":"A","text":"EELS and EDS are not identical observables: one measures beam-electron energy loss and the other emitted X-ray photon energy."},{"id":"B","text":"Changes in edge structure can support investigation of ionic valence and bonding."},{"id":"C","text":"The lecture overview includes excitation information such as phonons, plasmons and interband transitions."},{"id":"D","text":"Core-loss features can identify elements, while their fine structure may contain additional electronic-state information."}],"answers":["A","B","C","D"],"explanation":"C 正确：EELS能探测不同类型的能量转移，不仅是元素核心边。\nD 正确：核心边位置与元素有关，边附近结构还可能反映局部可用电子态。\nB 正确：课件利用氧化物细结构说明价态、键合等附加信息。\nA 正确：两者共享某些激发背景，但探测对象及对应跃迁过程不同。\n\n重点词：phonon（声子）；plasmon（等离激元）；fine structure（细结构）；valence（价态）。\n逻辑链：电子向样品转移能量 → 不同激发对应不同能损特征 → 边位置提供元素线索、边形提供电子态线索 → 根据问题选择合适能损区段。","source":{"file":"Electron Spectroscopy","page":"PDF pp. 44, 48, 50"},"difficulty":"进阶"},{"id":"SPEC-022","chapter":"Electron Spectroscopy","type":"multiple","prompt":"Why can the same core excitation lead to a symmetric EDS line but an asymmetric EELS ionization edge?","options":[{"id":"A","text":"EDS emission connects discrete core levels, whereas EELS excites a core electron into a distribution of available states."},{"id":"B","text":"EELS must have the same peak shape as EDS because both measurements involve the same sample element."},{"id":"C","text":"An EELS ionization threshold and its edge structure must be distinguished from the background before interpretation."},{"id":"D","text":"The EELS edge depends only on occupied core states and is unrelated to unoccupied conduction-band states."}],"answers":["A","C"],"explanation":"A 正确：EDS特征光子对应较明确的离散能级差；EELS激发的最终空态有分布，因此形成不对称电离边。\nD 错误：课件明确将边形与局部导带可用空态密度联系起来，不能只看已占据核心态。\nC 正确：核心边叠加在本底上，先识别阈值并扣除背景，才可讨论细结构。\nB 错误：元素相同不代表测量同一个物理量或同样的最终态分布。\n\n重点词：discrete levels（离散能级）；ionization edge（电离边）；unoccupied states（未占据态）；density of states（态密度）。\n逻辑链：EDS：离散壳层间弛豫 → 近对称特征线；EELS：核心电子进入一系列空态 → 能损分布与态密度相关 → 形成非对称边。","source":{"file":"Electron Spectroscopy","page":"PDF pp. 45–46, 52; STEM PDF pp. 3, 7"},"difficulty":"进阶","tutorial":"Electron Spectroscopy Tutorial Q3"},{"id":"SPEC-023","chapter":"Electron Spectroscopy","type":"multiple","prompt":"Which interpretation of an EDS–EELS spectral comparison is justified?","options":[{"id":"A","text":"EDS photon energy and EELS electron energy loss are the same observable produced by identical transitions."},{"id":"B","text":"The finer spectral resolution available in the illustrated EELS measurement can reveal energy structure not resolved by EDS."},{"id":"C","text":"EELS cannot provide element-related information because it detects electrons rather than X-ray photons."},{"id":"D","text":"Better spectral resolution alone guarantees finer spatial localization regardless of probe size and specimen."}],"answers":["B"],"explanation":"B 正确：课件比较说明EELS可区分更细的能量结构，不需要记具体分辨率数值才能理解这一用途。\nC 错误：核心损失边同样可提供元素信息。\nA 错误：EDS测辐射弛豫光子，EELS测束电子在激发中的能量损失，不能把两条能量轴当作完全相同过程。\nD 错误：能量轴的谱分辨率和样品空间定位是不同维度，后者还受探针和相互作用范围影响。\n\n重点词：spectral resolution（谱分辨率）；spatial resolution（空间分辨率）；energy transfer（能量转移）。\n逻辑链：能量结构分得更细 → 更易看见细谱特征；采样区域是否更小 → 仍需看探针与样品 → 两种分辨能力必须分别判断。","source":{"file":"Electron Spectroscopy","page":"PDF pp. 47"},"difficulty":"进阶"},{"id":"SPEC-024","chapter":"Electron Spectroscopy","type":"multiple","prompt":"Two regions contain the same transition-metal element but may have different chemical states. Which EELS arguments are justified?","options":[{"id":"A","text":"All compounds containing the same element must have identical edge shapes."},{"id":"B","text":"Different ionic valences can produce different edge fine structures even when the elemental identity is unchanged."},{"id":"C","text":"Edge-shape changes can reflect changes in local available electronic states and help distinguish chemical environments."},{"id":"D","text":"Only the total integrated intensity can carry chemical information; edge shape is irrelevant."}],"answers":["B","C"],"explanation":"B 正确：课件的氧化物对照表明同一元素的不同价态可改变边结构。\nA 错误：元素身份相同不代表价态、键合和局部电子结构相同。\nC 正确：边形与局部未占据态相关，可用于分析化学环境差异。\nD 错误：细结构形状正是附加化学状态信息的重要来源，不能只看总计数。\n\n重点词：ionic valence（离子价态）；bonding（键合）；local electronic structure（局部电子结构）。\n逻辑链：价态或键合改变 → 局部未占据电子态改变 → EELS边细结构变化 → 用形状而非仅总强度比较化学状态。","source":{"file":"Electron Spectroscopy","page":"PDF pp. 48"},"difficulty":"进阶"},{"id":"SPEC-025","chapter":"Electron Spectroscopy","type":"multiple","prompt":"A semiconductor has spatially varying composition. Which measurements and interpretations are appropriate?","options":[{"id":"A","text":"The onset of suitable low-loss excitations can provide a band-gap estimate."},{"id":"B","text":"Comparing a local EDS composition map with a local EELS gap map can investigate a composition–property relationship."},{"id":"C","text":"Low-loss EELS can probe excitation of valence electrons into available conduction-band states."},{"id":"D","text":"The band gap can be read directly from ordinary characteristic EDS photon counts without measuring an energy-loss spectrum."}],"answers":["A","B","C"],"explanation":"C 正确：带隙相关低损失信号涉及价电子激发，而非深核心电子激发。\nA 正确：对半导体或绝缘体，合适的激发起始可与带隙联系起来。\nB 正确：课件将组分与带隙沿位置比较，体现化学组成和电子性质的互补测量。\nD 错误：普通EDS主要给元素相关X射线，不直接代替低损失EELS的带隙测量。\n\n重点词：low-loss EELS（低损失EELS）；onset（起始位置）；band gap（带隙）。\n逻辑链：价带电子跃迁需要达到能隙要求 → 能损谱出现相关起始 → 提取局部带隙 → 与局部元素组成比较以研究结构/组分—性质联系。","source":{"file":"Electron Spectroscopy","page":"PDF pp. 49"},"difficulty":"进阶"},{"id":"SPEC-026","chapter":"Electron Spectroscopy","type":"multiple","prompt":"Which practical comparisons should guide a choice between EDS and EELS under the course conditions?","options":[{"id":"A","text":"EELS can be particularly useful for light-element and chemical-state questions, while its alignment and processing requirements must be considered."},{"id":"B","text":"EELS requires no alignment and is always less demanding to process than EDS."},{"id":"C","text":"EDS is common, relatively convenient and automated, and can cover many elemental lines in a spectrum."},{"id":"D","text":"Broad EDS spectral coverage guarantees that every element is detectable at every beam energy without yield or absorption limitations."}],"answers":["A","C"],"explanation":"C 正确：课件把成本、常见程度和自动化列为EDS的实用优点。\nB 错误：课件指出EELS需要对准，谱处理也较费人工，不能只看它的信息优势。\nA 正确：本课常规测量条件下，EELS对轻元素、过渡金属及价态键合问题有价值，但实验代价也重要。\nD 错误：激发条件、荧光产额和吸收仍限制可测信号，宽谱覆盖不是无条件检测保证。\n\n重点词：elemental coverage（元素覆盖范围）；alignment（对准）；chemical state（化学状态）。\n逻辑链：先明确需要元素组成还是电子/化学状态 → 比较可获得的信息 → 再考虑样品、对准、处理及成本 → 选择合适而非名义上最强的技术。","source":{"file":"Electron Spectroscopy","page":"PDF pp. 50"},"difficulty":"进阶"},{"id":"SPEC-027","chapter":"Electron Spectroscopy","type":"multiple","prompt":"When can EDXRF be preferred to electron-beam EDS even though both detect characteristic X-rays?","options":[{"id":"A","text":"When portable or off-site analysis is needed."},{"id":"B","text":"When the required measurement cannot be carried out in the electron microscope vacuum."},{"id":"C","text":"When the main requirement is the highly localized analysis provided by a focused STEM electron probe."},{"id":"D","text":"When the object is sensitive to electron-beam damage."}],"answers":["A","B","D"],"explanation":"D 正确：老师教程把电子束敏感性列为选择不同激发方式的理由。\nA 正确：便携、现场测量也是EDXRF的应用优势。\nB 正确：样品不能进入所需真空环境时，应考虑测量约束更合适的方法。\nC 错误：若主要目标是聚焦电子探针提供的高度局域谱学，应考虑合适的STEM测量；EDXRF的现场及样品兼容优势不能替代这一空间定位要求。\n\n重点词：excitation source（激发源）；beam-sensitive（束敏感的）；portable analysis（便携分析）。\n逻辑链：测量相同类型特征X射线 ≠ 激发方式和样品条件相同 → 检查电子束损伤、真空及现场限制 → 在适当场景选EDXRF而非EDS。","source":{"file":"Electron Spectroscopy","page":"PDF pp. 18, 51–52; STEM PDF p. 8"},"difficulty":"进阶","tutorial":"Electron Spectroscopy Tutorial Q4"},{"id":"SPEC-028","chapter":"Electron Spectroscopy","type":"multiple","prompt":"Why is conventional EDS not obtained merely by adding an X-ray detector to an ordinary STM?","options":[{"id":"A","text":"Increasing the number of low-energy tunnelling electrons automatically raises the kinetic energy of each electron."},{"id":"B","text":"The tunnelling electrons do not have sufficient energy for the core excitation underlying the characteristic X-rays discussed."},{"id":"C","text":"The sharp STM tip guarantees enough core-excitation energy because it gives good spatial localization."},{"id":"D","text":"An X-ray detector supplies the missing excitation energy to the tunnelling electrons."}],"answers":["B"],"explanation":"B 正确：老师教程强调普通STM电子能量不足；关键限制是不能有效产生所需内层激发。\nC 错误：空间定位好不等于入射电子能量足够，两者是不同条件。\nD 错误：探测器记录已有信号，不负责补充样品激发能量。\nA 错误：电子数量和单电子能量不能混为一谈，增大低能电子数不自动满足电离阈值。\n\n重点词：core excitation（内层激发）；tunnelling electron（隧穿电子）；excitation energy（激发能量）。\n逻辑链：特征X射线需要内层空穴 → 普通STM电子能量不足 → 不产生所需激发 → 只加探测器或只增加电子数不能补足这一条件。","source":{"file":"Electron Spectroscopy","page":"PDF pp. 51–52; STEM PDF p. 9"},"difficulty":"进阶","tutorial":"Electron Spectroscopy Tutorial Q5"},{"id":"SPEC-029","chapter":"Electron Spectroscopy","type":"multiple","prompt":"Which measurement–information matches are appropriate when combining microscopy with spectroscopy?","options":[{"id":"A","text":"A fine STEM probe with a suitable thin specimen can support highly localized EDS or EELS mapping."},{"id":"B","text":"Narrower WDS lines alone establish that neighbouring nanoscale regions are spatially resolved."},{"id":"C","text":"EDS can map elemental distribution, while EELS fine structure can add local chemical-state information."},{"id":"D","text":"BSE can guide the selection of compositionally different regions, but spectra are needed to establish elemental identities."}],"answers":["A","C","D"],"explanation":"A 正确：小探针及薄样品可使电子激发更局域，课件据此引出STEM中的高空间分辨谱学。\nC 正确：元素分布与价态/键合是相关但不同的信息，可联合回答问题。\nB 错误：WDS分开的是能量/波长相近谱线，空间上是否分开还需看采样体积与探针。\nD 正确：BSE适合寻找相对组分差异，不能独自给出唯一元素身份。\n\n重点词：localization（局域性）；complementary information（互补信息）；element identification（元素鉴别）。\n逻辑链：显微反差提示值得分析的位置 → 小探针局域采集谱学信号 → 按元素或化学状态提取信息 → 分开评估空间定位与能谱分离能力。","source":{"file":"Electron Spectroscopy","page":"PDF pp. 14, 17, 34, 47, 48, 51"},"difficulty":"进阶"},{"id":"SPEC-030","chapter":"Electron Spectroscopy","type":"multiple","prompt":"An expected EDS line is not clearly detected. Which explanations should be checked before concluding that the element is absent?","options":[{"id":"A","text":"Generated X-rays may be absorbed before reaching the detector."},{"id":"B","text":"The feature may be hidden by overlapping lines or a background that requires more careful processing."},{"id":"C","text":"The incident beam may not supply enough energy to excite the relevant core level."},{"id":"D","text":"The relevant transition may have a low fluorescence yield."}],"answers":["A","B","C","D"],"explanation":"C 正确：低于相应激发要求时，元素存在也不代表这条线会出现。\nD 正确：不同跃迁产额不同，元素可能有弱响应。\nA 正确：发射后还要逸出并到达探测器，传播吸收会减弱信号。\nB 正确：重叠、噪声和连续本底可能掩盖弱线，需要合理处理与复核，不能直接作不存在的结论。\n\n重点词：non-detection（未检出）；excitation threshold（激发阈值）；signal assignment（信号归属）。\n逻辑链：元素存在 → 还需能被激发、产生足够辐射、成功逸出并被区分 → 任一环节受限都可缺峰 → 未检出不能自动等同于不存在。","source":{"file":"Electron Spectroscopy","page":"PDF pp. 22, 24, 25, 42"},"difficulty":"进阶"},{"id":"SPEC-031","chapter":"Electron Spectroscopy","type":"multiple","prompt":"The beam remains on a small particle in a different matrix. A matrix-element EDS line becomes stronger at higher beam energy. Which interpretation is justified?","options":[{"id":"A","text":"Switching to narrower WDS peaks alone removes any matrix contribution caused by lateral electron spreading."},{"id":"B","text":"A larger X-ray-generation region may sample more of the surrounding matrix."},{"id":"C","text":"Keeping the surface beam position fixed guarantees an unchanged chemical sampling volume."},{"id":"D","text":"The intensity change proves that matrix atoms have diffused into the particle."}],"answers":["B"],"explanation":"B（正确）：提高束能可使电子在块体中的相互作用区域变大，来自邻近基体的X射线贡献因此可能增加。D（错误）：信号增强还可由采样区域改变解释，不能仅凭此证明发生了原子扩散或真实成分变化。C（错误）：固定表面落点不代表电子在样品内部的散射范围不变。A（错误）：WDS主要改善谱线的能量分离，不能仅靠峰变窄就消除空间采样混合。\n\n重点词：interaction volume（相互作用体积）；sampling region（采样区域）；matrix contribution（基体贡献）。\n逻辑链：束能提高 → X射线产生区域可能横向扩展 → 邻近基体贡献增加；先排查采样效应，再推断真实成分变化。","source":{"file":"Electron Spectroscopy; Aberration-corrected STEM","page":"Spectroscopy PDF pp.25,34–37; STEM PDF p.6"},"difficulty":"进阶","batch":"新增应用题"},{"id":"SPEC-032","chapter":"Electron Spectroscopy","type":"multiple","prompt":"Two regions show the same elements in EDS, but their bonding or ionic states may differ. Which follow-up reasoning is appropriate?","options":[{"id":"A","text":"The same element can show different EELS edge shapes when its local available electronic states differ."},{"id":"B","text":"Compare the core-loss EELS edge fine structures for information about the local chemical states."},{"id":"C","text":"Any change in EELS edge shape must indicate an additional element rather than a changed chemical environment."},{"id":"D","text":"Matching elemental identities in EDS guarantees identical ionic states in both regions."}],"answers":["A","B"],"explanation":"D（错误）：元素身份与离子价态不是同一个信息层次，相同元素可处于不同局部化学环境。B（正确）：核心损失EELS的边细结构能够提供元素身份之外的价态或键合信息。A（正确）：课件将边形与局部可用电子态联系，同一元素在不同价态下可有不同细结构。C（错误）：边形改变也可能来自同一元素的化学环境变化，不能直接当作新增元素。\n\n重点词：elemental identity（元素身份）；edge fine structure（边细结构）；chemical state（化学状态）。\n逻辑链：EDS确认有哪些元素 → 化学态问题仍可能未解决 → 检查EELS边细结构与局部可用态的变化。","source":{"file":"Electron Spectroscopy; Aberration-corrected STEM","page":"Spectroscopy PDF pp.44–48; STEM PDF pp.3,7"},"difficulty":"进阶","batch":"新增应用题"},{"id":"SPEC-033","chapter":"Electron Spectroscopy","type":"multiple","prompt":"The same specimen is examined by EDXRF and electron-beam EDS. Which comparisons are physically justified?","options":[{"id":"A","text":"Agreement of characteristic line positions does not require the two methods to use the same incident beam."},{"id":"B","text":"Vacuum, specimen-damage and portability constraints still matter when choosing between methods that detect similar characteristic X-rays."},{"id":"C","text":"Raw photon intensities should not be assumed directly comparable when excitation and measurement conditions differ."},{"id":"D","text":"The same characteristic transition can give the same photon energy even when the incident excitation differs."}],"answers":["A","B","C","D"],"explanation":"D（正确）：特征X射线由原子能级间跃迁产生，课件说明X射线或高能电子激发都可产生相同的特征线。A（正确）：发射线位置一致不等于激发源相同；EDXRF用入射X射线，EDS用电子束。C（正确）：激发、吸收和收集条件都影响测到的强度，不能由线位置相同就把原始峰高直接等同。B（正确）：老师Tutorial强调，便携、所需真空和电子束敏感性可决定何时选EDXRF。\n\n重点词：excitation（激发）；characteristic emission（特征发射）；measurement conditions（测量条件）。\n逻辑链：不同激发方式可产生相同核心空穴 → 相同特征跃迁可给出相同线位置 → 但强度解释与适用条件仍需分别判断。","source":{"file":"Electron Spectroscopy; Aberration-corrected STEM","page":"Spectroscopy PDF pp.18,24–25,52; STEM PDF p.8"},"difficulty":"进阶","batch":"新增应用题"},{"id":"SPEC-034","chapter":"Electron Spectroscopy","type":"multiple","prompt":"An extra EDS feature is strongly count-rate dependent, and a possible silicon-detector escape feature is also present. Which distinctions are correct?","options":[{"id":"A","text":"Neither a count-rate-related sum feature nor a detector escape feature should automatically be assigned to a new specimen element."},{"id":"B","text":"Reducing the photon arrival rate can reduce the probability that separate photon pulses overlap."},{"id":"C","text":"A sum feature is produced when part of a single photon event escapes from the detector."},{"id":"D","text":"A detector escape event can record less deposited energy without combining separate sample photons."}],"answers":["A","B","D"],"explanation":"B（正确）：到达率下降使相近时间内的独立事件更少重叠，可减轻脉冲堆积和求和峰。C（错误）：这描述的是能量逃逸机制；求和峰来自不同光子事件被合并计数。D（正确）：逃逸峰中，一次入射事件的部分能量以探测器内部产生的X射线逃出，记录的沉积能量因此降低。A（正确）：两类特征都可能由检测过程产生，应先检查仪器伪峰再作元素赋值。\n\n重点词：pulse pile-up（脉冲堆积）；sum peak（求和峰）；escape peak（逃逸峰）。\n逻辑链：先区分多个事件叠加与单事件能量逃逸 → 用计数率变化及谱形关系检查机制 → 避免把探测器伪峰当作样品新元素。","source":{"file":"Electron Spectroscopy","page":"PDF pp.31,40–41"},"difficulty":"进阶","batch":"新增应用题"},{"id":"STEM-001","chapter":"STEM · Resolution & lenses","type":"multiple","prompt":"An electron beam has a very short wavelength, but the microscope does not resolve details as small as that wavelength. Which explanations are correct?","options":[{"id":"A","text":"The measured resolution must equal the wavelength once the display magnification is sufficiently high."},{"id":"B","text":"A short wavelength is helpful, but lens aberrations can restrict the usable numerical aperture."},{"id":"C","text":"A larger usable convergence angle can reduce diffraction-related probe broadening."},{"id":"D","text":"Increasing electron kinetic energy lengthens the electron wavelength."}],"answers":["B","C"],"explanation":"B 对：电子透镜像差可限制实际能使用的会聚角，短波长本身不是充分条件。A 错：显示放大不能恢复没有分辨出的细节。C 对：可用会聚角增大，可减轻衍射造成的展宽。D 错：提高电子动能会缩短而非加长波长，但实际分辨率还受电子光学条件限制。\n\n重点词：wavelength（波长）；usable aperture（可用孔径）；resolution（分辨能力）\n逻辑链：短波长提供潜力 → 像差限制可用会聚角并展宽探针 → 实际分辨能力不能只看波长。","source":{"file":"Aberration-corrected STEM","page":"PDF pp. 13, 14"},"difficulty":"进阶"},{"id":"STEM-002","chapter":"STEM · Resolution & lenses","type":"multiple","prompt":"Which statements correctly explain how an electron lens focuses and magnifies?","options":[{"id":"A","text":"The strength of a magnetic lens is fixed at manufacture and cannot be changed electrically."},{"id":"B","text":"A glass lens can replace a magnetic electron lens because fast electrons pass through glass like visible light."},{"id":"C","text":"An electron lens can focus a beam and change image magnification; magnification is not itself a guarantee of finer resolution."},{"id":"D","text":"Magnetic fields deflect fast electrons, and changing the coil current changes lens strength."}],"answers":["C","D"],"explanation":"C 对：聚焦和放大的基本概念也适用于电子透镜，但把图像变大不等于获得更多真实细节。B 错：玻璃会阻挡、散射电子，不是电子透镜的透明材料。A 错：磁透镜的线圈电流可调，聚焦强度并非制造后固定。D 对：磁场改变电子轨迹，线圈电流使聚焦条件可调。\n\n重点词：magnetic lens（磁透镜）；coil current（线圈电流）；magnification（放大倍数）\n逻辑链：调节线圈电流 → 磁场及电子轨迹改变 → 聚焦与放大可调，但显示放大不等于真实分辨改善。","source":{"file":"Aberration-corrected STEM","page":"PDF pp. 15, 16"},"difficulty":"进阶"},{"id":"STEM-003","chapter":"STEM · Aberration diagnosis","type":"multiple","prompt":"Changing focus reverses an image elongation between two perpendicular directions. Which interpretations and actions are appropriate?","options":[{"id":"A","text":"The lens can have different focal lengths in perpendicular directions."},{"id":"B","text":"Changing only the acceleration voltage guarantees removal of the elongation."},{"id":"C","text":"This is the expected signature of axial coma, so beam tilt alone is the required correction."},{"id":"D","text":"A quadrupole stigmator can reshape an oval electron beam towards a circular beam."}],"answers":["A","D"],"explanation":"C 错：随欠焦/过焦转向的垂直拉伸是像散，不是边缘彗星状拖尾的彗差。A 对：不同方向焦距不同解释这种焦点相关变形。D 对：四极像散校正器通过定向磁场重塑束形。B 错：改束能不代替像散校正；仍应先识别像差并调stigmator。\n\n重点词：astigmatism（像散）；underfocus/overfocus（欠焦/过焦）；stigmator（像散校正器）\n逻辑链：不同方向焦距不一致 → 调焦时拉伸方向改变 → 调节stigmator以修正束形。","source":{"file":"Aberration-corrected STEM","page":"PDF pp. 18, 19, 20"},"difficulty":"进阶"},{"id":"STEM-004","chapter":"STEM · Aberration diagnosis","type":"multiple","prompt":"Which statements distinguish axial coma from chromatic aberration?","options":[{"id":"A","text":"Comet-like tails near the image edge can be reduced by aligning the beam more parallel to the optical axis."},{"id":"B","text":"Making the beam monochromatic also necessarily removes spherical aberration."},{"id":"C","text":"Chromatic aberration arises because electrons with different energies are not focused in exactly the same way."},{"id":"D","text":"The relatively narrow electron-energy distribution discussed in the lecture reduces the importance of chromatic aberration."}],"answers":["A","C","D"],"explanation":"A 对：彗星状拖尾对应轴向彗差，束倾斜对准有助于减轻。C 对：色差是不同能量对应不同聚焦条件；光学镜片的彩边是同类概念的类比。D 对：较窄的电子能量分布可减轻色差影响。B 错：单色性不等于无球差，球差还取决于电子离光轴的远近。\n\n重点词：axial coma（轴向彗差）；chromatic aberration（色差）；energy spread（能量分布宽度）\n逻辑链：先按现象区分来源 → 彗差检查束倾斜，色差检查能量分布 → 选择对应校正方法。","source":{"file":"Aberration-corrected STEM","page":"PDF pp. 21, 22, 23, 24"},"difficulty":"进阶"},{"id":"STEM-005","chapter":"STEM · Aberration diagnosis","type":"multiple","prompt":"A round electron lens gives a blurred probe even when all electrons have nearly the same energy. Which explanations are justified?","options":[{"id":"A","text":"The outer rays can be focused more strongly than near-axis rays."},{"id":"B","text":"Optical systems can use aspherical or suitable convex–concave glass elements, while the ordinary round electron lenses discussed act as simple convex lenses."},{"id":"C","text":"An ordinary circular aperture reshapes the electron beam in exactly the same way as a multipole corrector."},{"id":"D","text":"Spherical aberration is caused only by energy spread, so the stated observation is impossible."}],"answers":["A","B"],"explanation":"A 对：课件球差示意中远轴射线焦点更靠近透镜，造成探针展宽。D 错：把色差和球差混淆。B 对：这是光学与普通圆形磁透镜在球差控制方面的差别。C 错：限孔靠挡去严重离焦的外侧电子；多极校正靠磁场重塑束形，两者机制不同。\n\n重点词：spherical aberration（球差）；off-axis rays（远轴射线）；aspherical lens（非球面透镜）\n逻辑链：远轴与近轴电子聚焦不同 → 束斑模糊 → 需控制径向聚焦差异，而非只改善单色性。","source":{"file":"Aberration-corrected STEM","page":"PDF pp. 25, 26, 27"},"difficulty":"进阶"},{"id":"STEM-006","chapter":"STEM · Aperture trade-off","type":"multiple","prompt":"An uncorrected STEM gives broad probes with both very small and very large apertures. Which conclusions follow?","options":[{"id":"A","text":"The smallest aperture must give the narrowest probe because it removes every wave effect."},{"id":"B","text":"Large apertures can admit strongly aberrated outer rays; a medium aperture can minimize the total broadening."},{"id":"C","text":"Choosing the aperture requires a compromise between probe broadening and the available beam current."},{"id":"D","text":"Small apertures reduce high-angle spherical-aberration contributions but increase diffraction broadening and discard electrons."}],"answers":["B","C","D"],"explanation":"A 错：电子始终有波动性，小孔反而增加衍射。D 对：小孔挡掉高角度电子，可减少球差贡献，同时损失束流并加强衍射展宽。B 对：大孔会放入较强像差的外侧电子，中等孔径可使总展宽较小。C 对：不能只追求一个指标，既要考虑细节分辨，也要考虑有多少电子提供信号。\n\n重点词：aperture（孔径）；diffraction broadening（衍射展宽）；beam current（束流）\n逻辑链：缩小孔径 → 外侧球差贡献下降，但衍射增强且电子减少 → 在分辨与信号之间找合理折中。","source":{"file":"Aberration-corrected STEM","page":"PDF pp. 27, 28, 29, 31"},"difficulty":"进阶"},{"id":"STEM-007","chapter":"STEM · STEM detectors","type":"multiple","prompt":"Which descriptions of STEM image acquisition are correct?","options":[{"id":"A","text":"An ADF detector is an X-ray detector placed above the specimen."},{"id":"B","text":"A BF detector accepts central transmitted electrons, including the direct beam and low-angle scattering in the illustrated geometry."},{"id":"C","text":"BF and ADF signals cannot be recorded from the same scan because only one transmitted electron signal exists."},{"id":"D","text":"A focused probe is raster-scanned; the detected signal at each position contributes an image pixel."}],"answers":["B","D"],"explanation":"D 对：STEM与SEM一样逐点扫描形成像素。C 错：BF与ADF接受透射束中不同角度部分，可同步采集；课件MgO/Au例子就是同区互补图。B 对：BF接受中心直透及小角散射。A 错：ADF是样品下方环形电子探测器，不是上方X射线检测。\n\n重点词：raster scan（光栅扫描）；bright field（明场）；annular dark field（环形暗场）\n逻辑链：逐点扫描 → 探测器按散射角接收不同电子 → 同一区域可同时形成互补图像。","source":{"file":"Aberration-corrected STEM","page":"PDF pp. 29, 30, 40"},"difficulty":"进阶"},{"id":"STEM-008","chapter":"STEM · STEM detectors","type":"multiple","prompt":"Which statements about annular dark-field detector selection are supported?","options":[{"id":"A","text":"A bright atom must have the same brightness ordering in BF, LAADF and HAADF regardless of specimen structure."},{"id":"B","text":"Changing the accepted scattering angles is equivalent to measuring an EDS spectrum at each pixel."},{"id":"C","text":"HAADF, MAADF and LAADF select high-, medium- and low-angle ranges of transmitted scattered electrons."},{"id":"D","text":"LAADF can be useful for light elements because these scatter electrons relatively weakly."}],"answers":["C","D"],"explanation":"C 对：三种ADF模式按接受角度范围命名。D 对：课件指出轻元素散射较弱，低角接收可能有利。A 错：模式、接受角和结构都会影响对比，不能使用跨模式的通用亮度规则。B 错：角度选择仍是电子强度成像；EDS谱是特征X射线的能量分布。\n\n重点词：scattering angle（散射角）；HAADF（高角环形暗场）；LAADF（低角环形暗场）\n逻辑链：元素与结构影响散射 → 接受角度决定收集哪部分信号 → 对比需要结合模式解释。","source":{"file":"Aberration-corrected STEM","page":"PDF pp. 29, 39, 40"},"difficulty":"进阶"},{"id":"STEM-009","chapter":"STEM · Ronchigram & alignment","type":"multiple","prompt":"During STEM alignment, a Ronchigram can be used because","options":[{"id":"A","text":"A highly converged beam on an amorphous specimen region reveals lens-aberration signatures."},{"id":"B","text":"Its focus-dependent appearance can reveal coma, astigmatism and three-fold astigmatism; correction can enlarge the usable in-focus region."},{"id":"C","text":"It is necessarily a sharp Bragg-spot pattern from a perfect single crystal."},{"id":"D","text":"Its center and edge always have identical magnification, independent of focus."}],"answers":["A","B"],"explanation":"C 错：课件使用非晶区，而非要求完美单晶衍射。A 对：Ronchigram用于直接观察透镜像差。D 错：课件明确中心放大更高，形状也依赖调焦。B 对：视频示意这些像差，校正后可用聚焦区域扩大，从而容许更大孔径。\n\n重点词：Ronchigram（像差对准图）；amorphous region（非晶区域）；alignment（对准）\n逻辑链：会聚束照射非晶区 → 图样显露焦点与像差特征 → 对准后扩大可用聚焦区域。","source":{"file":"Aberration-corrected STEM","page":"PDF pp. 32, 33, 34"},"difficulty":"进阶"},{"id":"STEM-010","chapter":"STEM · Multipoles","type":"multiple","prompt":"Why are multipole elements useful for controlling an electron beam?","options":[{"id":"A","text":"A multipole corrector and a small aperture are interchangeable without changing beam shape or current."},{"id":"B","text":"Magnetic fields can exert direction-dependent forces that reshape the beam."},{"id":"C","text":"The stigmator is an example of using such forces to correct an oval beam."},{"id":"D","text":"They work only by absorbing outer electrons, just as a circular aperture does."}],"answers":["B","C"],"explanation":"B 对：多极磁场的方向性使不同位置的电子受到不同作用，可以重塑束形。C 对：像散校正器是这种思想的实际例子。D 错：多极元件通过磁场和洛伦兹力调轨迹，不是只吸收电子。A 错：挡束与改变聚焦轨迹的机制不同，能利用的束流也不同。\n\n重点词：multipole（多极元件）；Lorentz force（洛伦兹力）；beam shaping（束形调控）\n逻辑链：方向性磁场 → 电子轨迹被有选择地改变 → 束形可被校正；这不同于单纯挡束。","source":{"file":"Aberration-corrected STEM","page":"PDF pp. 19, 34, 35"},"difficulty":"进阶"},{"id":"STEM-011","chapter":"STEM · Aberration correction","type":"multiple","prompt":"An aberration corrector differs from merely closing the objective aperture because","options":[{"id":"A","text":"Correction can make a larger numerical aperture useful rather than requiring every outer ray to be blocked."},{"id":"B","text":"A stack of multipole elements reshapes the beam to compensate lens aberrations."},{"id":"C","text":"The corrector and ordinary magnetic lens together act effectively like an aspherical lens."},{"id":"D","text":"The main effect is to discard every high-angle electron while leaving all optical forces unchanged."}],"answers":["A","B","C"],"explanation":"B、C 对：多级多极透镜联合作用补偿像差，获得等效非球面聚焦。D 错：这混淆了校正与单纯挡束。A 对：校正使更多角度成分也能充分聚焦，因而可扩大可用NA。\n\n重点词：aberration corrector（像差校正器）；numerical aperture（数值孔径）；aspherical focusing（等效非球面聚焦）\n逻辑链：多极元件补偿像差 → 更多高角度电子可正确聚焦 → 更大孔径变得可用。","source":{"file":"Aberration-corrected STEM","page":"PDF pp. 34, 35, 36"},"difficulty":"进阶"},{"id":"STEM-012","chapter":"STEM · Aberration correction","type":"multiple","prompt":"At fixed acceleration voltage, spherical-aberration correction lowers the aberration curve in a probe-size graph. Which predictions are reasonable?","options":[{"id":"A","text":"The diffraction contribution must disappear because the electrons are no longer waves."},{"id":"B","text":"Improved probe localization and higher usable current can support high-resolution, faster imaging and spectroscopy."},{"id":"C","text":"A larger useful aperture can form a smaller probe while passing more beam electrons."},{"id":"D","text":"The optimum aperture must stay at the same value because the wavelength has not changed."}],"answers":["B","C"],"explanation":"A 错：课件标明衍射物理仍与原来相同。D 错：总展宽由衍射和球差共同决定，球差曲线降低会改变最佳折中点，通常移向更大孔径。C、B 对：这解释为什么在波长不变时仍可同时得到更小且更亮的探针。\n\n重点词：probe localization（探针局域性）；useful current（可用束流）；spectroscopy（谱学）\n逻辑链：球差贡献减小 → 可采用更大有效孔径 → 探针可同时更小且具有更多电子信号。","source":{"file":"Aberration-corrected STEM","page":"PDF pp. 31, 37, 38, 44"},"difficulty":"进阶"},{"id":"STEM-013","chapter":"STEM · Atomic imaging & mapping","type":"multiple","prompt":"A thin material and supported nanoparticles are imaged with different STEM detectors. Which interpretations are justified?","options":[{"id":"A","text":"BF and ADF images of the same nanoparticles can show complementary contrast."},{"id":"B","text":"A change in layer thickness can change an atomic-resolution image even without introducing a new element."},{"id":"C","text":"Identifying the detector geometry and specimen structure is necessary before treating bright or dark features as a chemical fingerprint."},{"id":"D","text":"A contrast change between regions proves a different element, even if layer number or detector mode also changes."}],"answers":["A","B","C"],"explanation":"B 对：课件的单层/双层例子说明，结构厚度本身也影响图像，不能把所有亮度差都归因于元素不同。A 对：BF和ADF接收不同散射角的电子，可提供互补图像。D 错：模式与结构也是变量，亮度变化不是元素改变的唯一证据。C 对：应先确认探测器和样品结构，再决定能从对比中推断什么。\n\n重点词：contrast（对比）；layer thickness（层厚）；complementary information（互补信息）\n逻辑链：探测模式和层厚改变散射对比 → 图像亮度不只由元素身份决定 → 先排除结构/模式差异，再解释化学差异。","source":{"file":"Aberration-corrected STEM","page":"PDF pp. 12, 30, 39, 40"},"difficulty":"进阶"},{"id":"STEM-014","chapter":"STEM · Atomic imaging & mapping","type":"multiple","prompt":"A STEM experiment saves an EDS or EELS spectrum at every scan point. Which statements about this spectrum-imaging dataset are correct?","options":[{"id":"A","text":"Element-related maps can be extracted from the stored spectra while retaining their scan-position information."},{"id":"B","text":"The dataset is identical to an ordinary ADF intensity image, so energy-resolved detection is unnecessary."},{"id":"C","text":"The beam must remain fixed at one point throughout the map."},{"id":"D","text":"Only a single image intensity for the whole specimen remains after acquisition."}],"answers":["A"],"explanation":"D 错：逐点保存的是能谱，不是全图仅一个数。A 对：谱与位置关联使采集后可提取元素分布等信息。C 错：必须扫描才能建立空间对应。B 错：普通ADF强度图不等于逐像素能谱，不能提供同样的元素能量信息。\n\n重点词：spectrum imaging（谱像）；scan position（扫描位置）；elemental map（元素分布图）\n逻辑链：每个位置记录能谱 → 保留能量与空间信息 → 可再提取元素或其他谱学分布。","source":{"file":"Aberration-corrected STEM","page":"PDF pp. 41"},"difficulty":"进阶"},{"id":"STEM-015","chapter":"STEM · Atomic imaging & mapping","type":"multiple","prompt":"Which statements correctly connect aberration-corrected STEM with local chemical analysis?","options":[{"id":"A","text":"EELS spectrum imaging can distinguish elemental distributions across a layered structure."},{"id":"B","text":"An aligned Ronchigram by itself replaces both EDS and EELS for elemental identification."},{"id":"C","text":"A small probe with higher useful current is valuable for localized spectra, but elemental identification still requires the relevant chemical signal."},{"id":"D","text":"Structural HAADF images can be combined with EDS maps at a grain boundary."}],"answers":["A","C","D"],"explanation":"D 对：课件用结构图与晶界EDS元素图联合展示局部结构—化学联系。A 对：逐点EELS谱可提取不同元素通道的空间分布。C 对：小探针增强定位，较高可用束流有助于收集谱学信号；元素身份仍需对应化学信号。B 错：Ronchigram用于电子光学对准，不能代替元素谱。\n\n重点词：chemical signal（化学信号）；grain boundary（晶界）；element-specific mapping（元素特异成像）\n逻辑链：小探针定位 + 足够信号 → 逐点EDS/EELS → 将局部化学与结构图联系。","source":{"file":"Aberration-corrected STEM","page":"PDF pp. 37, 41, 42, 43, 44"},"difficulty":"进阶"},{"id":"STEM-016","chapter":"STEM · Integrated diagnosis","type":"multiple","prompt":"A narrow-energy electron beam still gives perpendicular focus-dependent streaks and a broad probe at large aperture. Which proposed actions are physically justified?","options":[{"id":"A","text":"If spherical aberration is the large-aperture limitation, apply an appropriate multipole corrector before relying on a larger useful aperture."},{"id":"B","text":"Treat the perpendicular streaks as astigmatism and adjust the stigmator."},{"id":"C","text":"Assume monochromaticity removes spherical aberration, so a larger aperture is always safe."},{"id":"D","text":"Increase only display magnification to remove both physical probe broadening and lens aberrations."}],"answers":["A","B"],"explanation":"B 对：像散是方向相关焦距差异，应调stigmator。C 错：窄能量分布主要减轻色差，不能独自消除球差。A 对：多极球差校正可放宽大孔径限制，之后才可重新选择最佳孔径。D 错：显示放大不改变真实束斑、波长或像差；必须先分清限制来源。\n\n重点词：diagnosis（诊断）；monochromaticity（单色性）；physical resolution（实际分辨能力）\n逻辑链：先判断像散、球差或色差 → 使用对应电子光学控制 → 真实细节恢复依赖物理束斑，而非显示缩放。","source":{"file":"Aberration-corrected STEM","page":"PDF pp. 19, 20, 21, 24, 25, 31, 37"},"difficulty":"进阶"},{"id":"STEM-017","chapter":"STEM · Aberration diagnosis","type":"multiple","prompt":"Small features develop comet-like tails near the edge of the field. Which actions or interpretations are appropriate?","options":[{"id":"A","text":"Use the alignment information to distinguish an imaging distortion from genuine specimen structure."},{"id":"B","text":"Check beam alignment and reduce beam tilt relative to the optical axis."},{"id":"C","text":"Treat every such tail as a new elongated particle without checking the electron optics."},{"id":"D","text":"Apply a conductive coating as the direct optical correction for axial coma."}],"answers":["A","B"],"explanation":"B 对：课件将这种拖尾与轴向彗差联系，并通过束倾斜对准减轻。C 错：应先排查可随对准改变的成像失真，不能直接当作样品形状。A 对：这正是对准和Ronchigram检查的实用意义。D 错：导电镀层针对充电，不是修正透镜彗差的直接操作。\n\n重点词：comet-like tail（彗星状拖尾）；beam tilt（束倾斜）；image artefact（成像伪影）\n逻辑链：图像边缘拖尾 → 考虑轴向彗差并检查束倾斜 → 校正后再判断是否为真实形貌。","source":{"file":"Aberration-corrected STEM","page":"PDF pp. 21, 32, 33"},"difficulty":"进阶"},{"id":"STEM-018","chapter":"STEM · Integrated diagnosis","type":"multiple","prompt":"An instrument has spherical-aberration correction, but a broader electron-energy distribution still degrades focus. Which conclusions are justified?","options":[{"id":"A","text":"Correcting spherical aberration does not automatically remove energy-dependent focusing differences."},{"id":"B","text":"Increasing display magnification is sufficient to restore the missing fine detail."},{"id":"C","text":"The blur proves that spherical and chromatic aberrations are the same physical effect."},{"id":"D","text":"A narrower energy distribution can reduce the chromatic contribution."}],"answers":["A","D"],"explanation":"A 对：球差关注近轴/远轴轨迹，色差关注不同能量的聚焦，二者不等同。D 对：能量分布变窄，可减少不同能量的焦点差异。C 错：像差可以并存，不能因都表现为模糊就混为一个机制。B 错：显示放大不会改变真实聚焦和探针展宽。\n\n重点词：chromatic contribution（色差贡献）；energy distribution（能量分布）；spherical correction（球差校正）\n逻辑链：能量分布变宽 → 不同能量电子的聚焦位置更分散 → 即使已校正球差，也可能仍需控制色差。","source":{"file":"Aberration-corrected STEM","page":"PDF pp. 24, 25, 36, 37"},"difficulty":"进阶"},{"id":"STEM-019","chapter":"STEM · New applications","type":"multiple","prompt":"Two STEM instruments use the same beam energy, but one forms a smaller and brighter probe after aberration correction. Which conclusions are justified?","options":[{"id":"A","text":"The difference can arise from improved electron optics rather than a shorter electron wavelength."},{"id":"B","text":"Correction can make more of the aperture useful, allowing better localization and more beam electrons."},{"id":"C","text":"The brighter probe means an EDS detector must also have better energy resolution."},{"id":"D","text":"Equal beam energy requires equal practical spatial resolution, regardless of lens quality."}],"answers":["A","B"],"explanation":"A 对：束能相同不代表透镜像差和可用孔径相同；这里不必用波长差解释。D 错：实际分辨率还受像差、孔径和束斑影响。B 对：球差校正可让更多高角电子正确聚焦，实现更小且更亮的探针。C 错：探针空间性能和X射线探测器的能量分辨率是不同维度。\n\n重点词：electron optics（电子光学）；usable aperture（可用孔径）；probe localization（探针局域性）\n逻辑链：束能保持相同 → 比较像差和可用孔径 → 仍可解释探针尺寸及束流的变化，而不能自动推断谱分辨率变化。","source":{"file":"Aberration-corrected STEM","page":"PDF pp. 14,31,36–37"},"difficulty":"进阶","batch":"新增应用题"},{"id":"STEM-020","chapter":"STEM · New applications","type":"multiple","prompt":"A specimen has crystalline and amorphous regions. Before recording a highly localized STEM map, which alignment plan follows the lecture?","options":[{"id":"A","text":"Use a conductive coating as a complete substitute for electron-optical alignment."},{"id":"B","text":"Look for focus-dependent aberration signatures before attributing every distorted feature to the specimen."},{"id":"C","text":"Use a suitable amorphous region under a strongly convergent beam to inspect the Ronchigram."},{"id":"D","text":"Require sharp Bragg spots from a perfect crystal as the only possible Ronchigram."}],"answers":["B","C"],"explanation":"C 对：课件的Ronchigram使用会聚束照射非晶区来显示电子光学像差。D 错：这不是要求完美单晶衍射斑点的测量。B 对：先校正成像系统，才能减少把光学失真误当真实结构或定位信息的风险。A 错：导电层帮助处理充电，不代替透镜与束形对准。\n\n重点词：amorphous region（非晶区）；Ronchigram（像差对准图）；alignment（对准）\n逻辑链：选择合适的非晶区域 → 用Ronchigram识别调焦及像差特征 → 校正后再对目标区域做局域成像或谱像。","source":{"file":"Aberration-corrected STEM","page":"PDF pp. 32–34,41"},"difficulty":"进阶","batch":"新增应用题"},{"id":"STEM-021","chapter":"STEM · New applications","type":"multiple","prompt":"A weakly scattering atomic feature is difficult to see in HAADF but is clearer in a lower-angle or BF image. Which interpretations are appropriate?","options":[{"id":"A","text":"Element-specific spectroscopy can help when brightness alone does not establish chemical identity."},{"id":"B","text":"Detector acceptance can change the visibility of the same specimen feature."},{"id":"C","text":"The HAADF result alone proves that the feature is absent."},{"id":"D","text":"Lower-angle collection can be useful for weakly scattering light elements."}],"answers":["A","B","D"],"explanation":"C 错：未在某一通道看清并不等于结构不存在。B 对：不同探测器接受不同角度的电子，导致可见性不同。D 对：课件明确说明轻元素散射较弱，低角暗场可有帮助。A 对：不能跨模式把亮度直接当唯一元素标签，必要时用EDS/EELS补充。\n\n重点词：detector acceptance（探测接受范围）；weak scattering（弱散射）；element-specific signal（元素特异信号）\n逻辑链：结构产生不同角度的散射 → 各探测通道接收不同部分 → 某通道信号弱时，应先检查方法敏感性而非直接判定不存在。","source":{"file":"Aberration-corrected STEM","page":"PDF pp. 29–30,40,42–43"},"difficulty":"进阶","batch":"新增应用题"},{"id":"STEM-022","chapter":"STEM · New applications","type":"multiple","prompt":"A laboratory wants finer and faster local spectrum imaging. Which proposed improvements address the physical requirements?","options":[{"id":"A","text":"Use a well-corrected localized probe and enough useful beam current to collect spectra."},{"id":"B","text":"Increase displayed magnification alone and assume that the excitation region becomes smaller."},{"id":"C","text":"Record the relevant EDS or EELS signal at the scan positions instead of relying only on an intensity image."},{"id":"D","text":"Choose the smallest aperture without considering diffraction or the loss of electrons."}],"answers":["A","C"],"explanation":"A 对：更小的探针改善定位，足够可用束流支持谱学计数；像差校正有助于同时满足。B 错：显示缩放不是实际束斑控制。C 对：元素或能量信息需要相应谱学测量，普通强度图不能自动恢复。D 错：小孔会损失电子并加强衍射，不能只看孔径小这一项。\n\n重点词：spectrum imaging（谱像）；useful current（可用束流）；signal counts（信号计数）\n逻辑链：先满足真实空间定位 → 再保证足够的谱学信号并逐点记录 → 才能支持更精细、较快的局域分析。","source":{"file":"Aberration-corrected STEM","page":"PDF pp. 31,37,41,44"},"difficulty":"进阶","batch":"新增应用题"},{"id":"CMP-001","chapter":"综合比较 · Choosing a workflow","type":"multiple","prompt":"Which technique–constraint matches are supported by the lectures?","options":[{"id":"A","text":"Wet, uncoatable insulation requiring finer detail than light microscopy — consider ESEM."},{"id":"B","text":"A selected buried device feature — consider a site-specific FIB lamella for transmission analysis."},{"id":"C","text":"Local elemental identity rather than only heavy/light contrast — acquire suitable spectroscopy."},{"id":"D","text":"Off-site elemental analysis of an electron-beam-sensitive object — consider EDXRF rather than electron-beam EDS."}],"answers":["A","B","C","D"],"explanation":"C：正确。BSE或ADF的成分相关明暗不能在任意样品中唯一鉴定所有元素，应配合EDS/EELS等。\nA：正确。ESEM可兼顾样品附近气体/湿态和电荷中和。选择基于环境与分辨需求，不表示任何样品都不会受电子束影响。\nD：正确。STEM教程给出便携、无法用所需真空及电子束敏感等采用EDXRF的理由。\nB：正确。选点和透射是两项要求：FIB确保薄片包含目标，后续还须薄到能透电子。\n\n重点词：information requirement（信息需求）；specimen constraint（样品限制）；technique selection（技术选择）\n逻辑链：先确定要测形貌、元素还是内部结构 → 再检查真空、透射、制样和损伤限制 → 选择有相应信号且样品能接受的方法。","source":{"file":"跨课件比较","page":"SEM PDF pp.45–47; TEM PDF p.21; STEM PDF p.8; Spectroscopy PDF p.14"},"difficulty":"进阶"},{"id":"CMP-002","chapter":"综合比较 · Choosing a workflow","type":"multiple","prompt":"A rough ceramic contains metal-rich nanoparticles. Which proposed workflow gives information appropriate to each question?","options":[{"id":"A","text":"Treat every bright BSE pixel as a unique crystal-lattice index."},{"id":"B","text":"Use a higher display magnification to convert an SE image into an atomic elemental map."},{"id":"C","text":"Use a suitable thin specimen and diffraction to determine lattice spacing or crystal phase."},{"id":"D","text":"Use SE for surface morphology and EDS to identify the elemental distribution."}],"answers":["C","D"],"explanation":"B：错误。显示放大不会产生原子级探针或逐点元素能谱；原子分辨谱像需合适STEM及谱学信号。\nD：正确。SE几何对比与EDS特征X射线分别回答形貌和元素身份，可在同一区域互补而不是相互替代。\nA：错误。BSE主要由核散射形成成分相关对比，不能从一个亮度值直接索引晶面。\nC：正确。TEM衍射提供晶体学信息；化学分布与晶体结构不是同一问题，准备薄样品仍是前提。\n\n重点词：topography（形貌）；elemental distribution（元素分布）；diffraction（衍射）\n逻辑链：不同物理信号承载不同信息 → SE看形貌、能谱辨元素、衍射看晶体结构 → 同一样品可用互补方法回答不同问题。","source":{"file":"跨课件比较","page":"SEM PDF p.39; TEM PDF pp.39,54; Spectroscopy PDF pp.14,17"},"difficulty":"进阶"},{"id":"CMP-003","chapter":"综合比较 · Choosing a workflow","type":"multiple","prompt":"A semiconductor grain boundary needs composition, band-gap and bonding/valence information. Which measurements are justified?","options":[{"id":"A","text":"One BF or HAADF intensity value is a complete replacement for all three spectral measurements."},{"id":"B","text":"Spectrum imaging in a suitably corrected STEM can associate these spectra with small scan positions."},{"id":"C","text":"EDS can map elemental composition, while low-loss EELS can probe a band-gap onset."},{"id":"D","text":"Core-loss EELS fine structure can add electronic-state or ionic-valence information."}],"answers":["B","C","D"],"explanation":"C：正确。两类谱分别回答元素含量与价带到导带的低能激发；不能把EDS核心线峰位当带隙。\nD：正确。核心损失边形与可用空态/局部态密度有关，可补充元素身份之外的化学状态信息。\nA：错误。接受角不同的强度信息并不等于完整的元素、带隙和化学态能谱。\nB：正确。逐像素谱保留空间—能量关联，小探针和较高可用束流利于局部图，但并非所有单通道强度像都自带这些谱。\n\n重点词：composition（组成）；band gap（带隙）；chemical state（化学状态）\n逻辑链：先把问题拆成所需物理量 → EDS对应元素、低损失EELS对应带隙、核心损失EELS补充化学态 → 谱像把信息定位到区域。","source":{"file":"跨课件比较","page":"STEM PDF pp.4,41; Spectroscopy PDF pp.48–50"},"difficulty":"进阶"},{"id":"CMP-004","chapter":"综合比较 · Resolution & controls","type":"multiple","prompt":"Two X-ray lines overlap, and their signals also come from adjacent nanoscale regions. Which changes address the different limitations?","options":[{"id":"A","text":"WDS can improve separation of the line energies, while a smaller useful STEM probe can improve spatial localization."},{"id":"B","text":"Once atomic-resolution intensity imaging is possible, all overlapping EDS lines must be resolved."},{"id":"C","text":"Aberration correction can provide a smaller probe and more useful beam current without automatically changing the EDS detector response."},{"id":"D","text":"Higher WDS spectral resolution guarantees a smaller specimen interaction volume."}],"answers":["A","C"],"explanation":"C：正确。球差校正改变电子探针与可用孔径，不会凭此把EDS能量分辨率变成WDS。\nD：错误。WDS分光能力不等于改变样品内电子散射体积。\nA：正确。分开邻近能量峰属于谱分辨，分开邻近位置属于空间分辨；两者应分别处理。\nB：错误。原子尺度空间能力不消除能量谱峰的探测器展宽或重叠。\n\n重点词：spectral resolution（谱分辨率）；spatial resolution（空间分辨率）；interaction volume（相互作用体积）\n逻辑链：峰挤在一起是能量分辨问题；区域混在一起是空间定位问题 → 分别改善分光与探针/相互作用条件 → 一个指标提升不能自动修复另一个。","source":{"file":"跨课件比较","page":"STEM PDF pp.37,41; Spectroscopy PDF pp.34,37"},"difficulty":"进阶"},{"id":"CMP-005","chapter":"综合比较 · Signals & interpretation","type":"multiple","prompt":"Which cautions remain valid when comparing BF, DF, HRTEM and HAADF data?","options":[{"id":"A","text":"A strongly scattering region can be dark in BF but bright in a suitably selected DF or ADF signal."},{"id":"B","text":"HRTEM intensity can reverse with focus without requiring atoms to change chemical identity."},{"id":"C","text":"Failure to appear bright in one DF condition does not prove that a crystalline phase is absent."},{"id":"D","text":"Atomic resolution does not remove the need to know detector geometry and specimen structure."}],"answers":["A","B","C","D"],"explanation":"D：正确。HAADF、BF及HRTEM分别依赖不同散射接受或相位条件，解释时仍必须辨认模式与样品结构。\nB：正确。相位干涉及离焦引起对比变化，亮暗本身不是元素转变的充分证据。\nA：正确。不同模式接受的电子方向不同，不能要求同一区域在所有模式都保持同一明暗。\nC：正确。同相不同取向可能不满足被选反射，单个DF像存在选择性。\n\n重点词：detector geometry（探测几何）；diffraction condition（衍射条件）；phase contrast（相位对比）\n逻辑链：样品散射电子 → 不同模式选择不同束或让其干涉 → 同一结构可呈不同明暗，不能脱离模式解释亮度。","source":{"file":"跨课件比较","page":"TEM PDF pp.47,50–53; STEM PDF pp.29,40"},"difficulty":"进阶"},{"id":"CMP-006","chapter":"综合比较 · Signals & interpretation","type":"multiple","prompt":"A high-resolution spectrum shows two elements with unequal peak heights. Which quantitative argument is defensible?","options":[{"id":"A","text":"WDS needs no quantification correction because its peaks are narrow."},{"id":"B","text":"An EELS edge must be fitted as the same symmetric line as EDS before any chemical information is used."},{"id":"C","text":"Apply appropriate corrections before comparing concentrations; better peak separation alone does not make raw heights atomic percentages."},{"id":"D","text":"The method with the highest spectral resolution is automatically the best for every element and specimen."}],"answers":["C"],"explanation":"C：正确。荧光产额、吸收、原子序数、几何和束能等都影响强度。ZAF及谱处理不因WDS分峰较好而失去必要性。\nB：错误。EELS核心边反映激发至可用空态的能量分布，与离散跃迁X射线峰形不同；强行同形会丢失状态信息。\nD：错误。课件还比较成本、处理工作、透射要求和可用损失能区；最高谱分辨不是所有情景的充分选择条件。\nA：错误。谱分辨率提高解决重叠，不取消强度的物理响应与定量修正。\n\n重点词：peak intensity（峰强）；matrix correction（基体修正）；concentration（浓度）\n逻辑链：不同元素和样品条件产生不同响应 → 峰高不只由含量决定 → 峰分离后仍需谱处理与定量修正。","source":{"file":"跨课件比较","page":"Spectroscopy PDF pp.24–26,47,50; STEM PDF pp.2,7"},"difficulty":"进阶"},{"id":"CMP-007","chapter":"综合比较 · Resolution & controls","type":"multiple","prompt":"A low-voltage SE setting gives a good image but misses a required EDS line; increasing count rate produces a sum peak. Which responses are appropriate?","options":[{"id":"A","text":"Increase beam energy when needed, while recognizing that a larger interaction volume may worsen spatial localization."},{"id":"B","text":"Lower beam current to reduce pile-up rather than treating the sum peak as a new element."},{"id":"C","text":"Check the core-excitation energy: increasing current cannot replace insufficient energy per electron."},{"id":"D","text":"Identify a sum peak as a characteristic line whose energy continuously follows the accelerating voltage."}],"answers":["A","B","C"],"explanation":"C：正确。特征线能否出现取决于单电子能量是否足以激发相关壳层，电子数再多也不能直接替代阈值。\nB：正确。求和峰来自同时到达的光子被合并计数，降低通量可减轻；这与调能量消除激发线不是同一操作。\nD：错误。求和峰与特征光子叠加有关，而真正特征跃迁能量由元素能级差决定，不随束压连续漂移。\nA：正确。激发线系与空间分辨有权衡；更高电压不是只带来好处。\n\n重点词：excitation threshold（激发阈值）；beam current（束流）；pile-up（脉冲堆积）\n逻辑链：能量决定能否激发目标跃迁，电子通量影响计数与堆积 → 分别调整束能和束流 → 同时留意空间定位的代价。","source":{"file":"跨课件比较","page":"SEM PDF p.37; TEM PDF p.8; Spectroscopy PDF pp.40,42"},"difficulty":"进阶"},{"id":"CMP-008","chapter":"综合比较 · Choosing a workflow","type":"multiple","prompt":"Which reasoning correctly separates specimen-preparation requirements?","options":[{"id":"A","text":"Gas-ion neutralization in ESEM means that no electron-beam-induced specimen change can occur."},{"id":"B","text":"An electron-transparent insulator is automatically conductive."},{"id":"C","text":"A site-specific thin lamella can locate a buried feature, whereas ESEM can address an uncoatable wet surface without that conventional thinning workflow."},{"id":"D","text":"A thin support and a conductive coating solve the same problem, so either always substitutes for the other."}],"answers":["C"],"explanation":"C：正确。应按所问是埋藏透射结构还是湿表面来选制样与环境，不能一律要求所有材料同样干燥镀膜。\nA：错误。中和电荷不等于取消束加热、结构损伤或其他照射效应。\nB：错误。厚度与电导性质独立，足够薄并不会自动成为金属。\nD：错误。电子透明解决透射及散射展宽，导电层解决电荷泄放；二者不可普遍互换。\n\n重点词：electron transparency（电子透明性）；conductivity（导电性）；charge neutralization（电荷中和）\n逻辑链：薄样允许透射，导电路径允许电荷泄放，环境气体可中和电荷 → 三个要求针对不同机制 → 制样步骤不能随意互换。","source":{"file":"跨课件比较","page":"TEM PDF pp.19–21; SEM PDF pp.23–24,44–47"},"difficulty":"进阶"},{"id":"CMP-009","chapter":"综合比较 · Signals & interpretation","type":"multiple","prompt":"Which proposed acquisition has the required signal path described in these lectures?","options":[{"id":"A","text":"Measure transmitted-electron energy losses with EELS on a suitable TEM/STEM specimen."},{"id":"B","text":"Generate the required EDS core excitations with ordinary low-energy STM tunnelling electrons."},{"id":"C","text":"Infer an EELS spectrum from one BF total-intensity number at each pixel without measuring energy."},{"id":"D","text":"Use a conventional bulk-sample SEM reflection detector as an EELS analyser simply by increasing beam current."}],"answers":["A"],"explanation":"C：错误。总强度未保留能量维度，不能恢复完整能量损失谱。\nA：正确。EELS必须有可透过样品的束电子供能量分析；它与EDS测发射光子的路径不同。\nB：错误。STEM教程指出STM电子单个电子能量太低，不能激发EDS所需的高能核心跃迁；会扫描不代表激发能量足够。\nD：错误。通量改变不建立透射几何，常规SEM上方反射收集不能因此变成EELS。\n\n重点词：signal path（信号路径）；energy loss（能量损失）；core excitation（核心激发）\n逻辑链：先确认被测粒子与能量维度 → 透射电子能损是EELS，发射X射线是EDS → 有扫描能力不等于具备所有谱学路径。","source":{"file":"跨课件比较","page":"Spectroscopy PDF p.43; STEM PDF pp.5,9,41"},"difficulty":"进阶"},{"id":"CMP-010","chapter":"综合比较 · Resolution & controls","type":"multiple","prompt":"Which statements correctly separate the diagnoses and controls in electron microscopy?","options":[{"id":"A","text":"Focus-dependent perpendicular streaks — adjust the stigmator rather than assuming elemental segregation."},{"id":"B","text":"Charge accumulation — provide a conductive connection/coating, or suitable ESEM charge-neutralization conditions."},{"id":"C","text":"Increase displayed magnification to eliminate both charging and astigmatism physically."},{"id":"D","text":"Change magnetic-lens coil current to vary focusing strength, while distinguishing that current from the incident electron flux."}],"answers":["A","B","D"],"explanation":"C：错误。显示变大不改变样品电荷路径或电子光学失准，只可能把伪影放大。\nB：正确。这针对样品中的电荷积累；导电泄放或正气体离子中和与磁透镜束形校正是不同机制。\nD：正确。线圈电流控制磁场/透镜强度；beam current是每秒入射电子数，二者不能因都称电流就混为一谈。\nA：正确。这是像散征象，四极stigmator修正椭圆束。仅改变颜色或成分标注不会修正电子光学。\n\n重点词：charging（充电）；astigmatism（像散）；focusing current（透镜线圈电流）\n逻辑链：先区分样品带电与光学束形问题 → 前者提供泄放/中和，后者调stigmator → 不把所有模糊都归为同一原因。","source":{"file":"跨课件比较","page":"SEM PDF pp.23,46; STEM PDF pp.16,19–20; TEM PDF p.8"},"difficulty":"进阶"},{"id":"CMP-011","chapter":"综合比较 · Principles & applications","type":"multiple","prompt":"A wet, insulating surface has features too fine for the available light microscope. Which choices are justified?","options":[{"id":"A","text":"Use gas-ion charge neutralization as an alternative to a conductive coating when the specimen cannot be coated."},{"id":"B","text":"Assume that ordinary high-vacuum SEM preparation will always preserve the original wet state."},{"id":"C","text":"Consider ESEM because it can combine fine surface imaging with a suitable gaseous specimen environment."},{"id":"D","text":"Assume that increasing optical display magnification alone will reveal the unresolved features."}],"answers":["A","C"],"explanation":"C 对：需要细节分辨且要保留合适环境时，ESEM是课件支持的选择。B 错：抽真空和常规制样可能改变湿态。A 对：环境中的正离子可中和负电荷，减少必须镀导电层的要求。D 错：放大已模糊的光学像不能凭空恢复细节。\n\n重点词：wet state（湿态）；ESEM（环境扫描电镜）；resolution limit（分辨限制）\n逻辑链：湿态/不能镀膜是样品限制，细节小是分辨需求 → 同时满足两项条件再选设备 → ESEM的环境和电荷机制有明确用途。","source":{"file":"SEM; TEM","page":"SEM pp. 45,46,47; TEM pp. 7"},"difficulty":"进阶"},{"id":"CMP-012","chapter":"综合比较 · Principles & applications","type":"multiple","prompt":"A large heritage object needs portable elemental analysis and should not undergo electron-microscope preparation. Which arguments are appropriate?","options":[{"id":"A","text":"A FIB cut is automatically preferable whenever the goal is elemental information."},{"id":"B","text":"Excitation method and specimen constraints remain important even when two methods detect similar emitted radiation."},{"id":"C","text":"EDXRF may be preferable when portable analysis is needed without placing the object in an electron-microscope vacuum."},{"id":"D","text":"EDS and EDXRF must require identical preparation because they can detect the same characteristic lines."}],"answers":["B","C"],"explanation":"C 对：老师教程列出便携、不能使用所需真空或容易受电子束损伤等采用EDXRF的理由。D 错：相同的特征X射线不表示激发源、几何与制样相同。A 错：若无需透射结构信息，不能无条件把破坏性选点切片当首选。B 对：方法选择要同时看激发方式、信息需求与样品可接受条件。\n\n重点词：EDXRF（能量色散X射线荧光）；excitation source（激发源）；portability（便携性）\n逻辑链：可测相似特征线但激发方式不同 → 真空、损伤和便携要求随之不同 → 应按样品限制选择，而非只按信号名称。","source":{"file":"Aberration-corrected STEM; Electron Spectroscopy","page":"STEM pp. 8; Spectroscopy pp. 52"},"difficulty":"进阶"},{"id":"CMP-013","chapter":"综合比较 · Principles & applications","type":"multiple","prompt":"A nanoparticle study asks whether particles share a crystal structure and whether their elemental composition differs. Which measurements answer the appropriate question?","options":[{"id":"A","text":"Combine imaging, diffraction and spectroscopy when the structural and chemical questions are separate."},{"id":"B","text":"Use suitable elemental spectra or maps to examine chemical composition."},{"id":"C","text":"Use electron diffraction to examine crystallographic information."},{"id":"D","text":"Treat the same crystal structure as proof of identical elemental concentrations."}],"answers":["A","B","C"],"explanation":"C 对：衍射含晶格、晶相与有序性等结构信息。B 对：能谱提供元素相关信息。D 错：结构相同不自动保证成分比例完全相同。A 对：这些手段互补，先明确问题再匹配测量。\n\n重点词：crystal structure（晶体结构）；elemental identity（元素身份）；complementary techniques（互补技术）\n逻辑链：晶体排列决定结构信号，元素跃迁决定化学谱 → 两者不是同一物理量 → 需要时联合测量并关联位置。","source":{"file":"TEM; Electron Spectroscopy","page":"TEM pp. 35,41,46,55; Spectroscopy pp. 17,38"},"difficulty":"进阶"},{"id":"CMP-014","chapter":"综合比较 · Principles & applications","type":"multiple","prompt":"Which signal–origin pairs are correct?","options":[{"id":"A","text":"EDS — characteristic X-ray photons emitted after suitable atomic excitations."},{"id":"B","text":"BSE — incident beam electrons scattered back by the specimen."},{"id":"C","text":"EELS — energy losses of beam electrons transmitted through a suitable specimen."},{"id":"D","text":"SE — low-energy electrons emitted from the specimen near its surface."}],"answers":["A","B","C","D"],"explanation":"D 对：SE来自样品电子的低能发射，具有近表面敏感性。B 对：BSE原本属于入射束，散射后返回。A 对：EDS测发射光子的能量。C 对：EELS测透射束电子损失的能量；两者不是把同一个探测量换名称。\n\n重点词：emitted electron（发射电子）；backscattered electron（背散射电子）；transmitted electron（透射电子）\n逻辑链：先辨认被收集的是样品电子、束电子还是光子 → 再判断信号的形成机制 → 才能推断其适合回答的信息类型。","source":{"file":"SEM; Electron Spectroscopy","page":"SEM pp. 39,40; Spectroscopy pp. 43,44,45"},"difficulty":"进阶"},{"id":"CMP-015","chapter":"综合比较 · Principles & applications","type":"multiple","prompt":"Which statements correctly distinguish scattering, interference and spectroscopy?","options":[{"id":"A","text":"Characteristic X-rays and electron-energy losses provide the same measured quantity merely with different detector names."},{"id":"B","text":"Backscattered contrast and characteristic X-ray spectra arise from different interactions, so they need not provide identical information."},{"id":"C","text":"Electron diffraction can contain coherent interference information about atomic arrangement."},{"id":"D","text":"EELS is restricted to counting elastically scattered electrons without resolving their energy."}],"answers":["B","C"],"explanation":"C 对：衍射是相干电子波的干涉，携带排列信息。D 错：EELS要求能量分析，关注束电子能量损失。A 错：X射线光子能量与透射电子损失能量对应不同事件和谱形。B 对：核散射相关对比不等同于原子跃迁发射的元素谱。\n\n重点词：coherent interference（相干干涉）；elastic scattering（弹性散射）；inelastic excitation（非弹性激发）\n逻辑链：核散射、波的干涉、能量转移是不同过程 → 对应不同可检测量 → 对比相似不表示物理机制相同。","source":{"file":"SEM; TEM; Electron Spectroscopy","page":"SEM pp. 40; TEM pp. 27,28,29; Spectroscopy pp. 18,44,45"},"difficulty":"进阶"},{"id":"CMP-016","chapter":"综合比较 · Principles & applications","type":"multiple","prompt":"An expected EDS line is weak or missing. Which checks should precede a conclusion that the element is absent?","options":[{"id":"A","text":"Whether peak overlap or background makes the line difficult to identify."},{"id":"B","text":"Whether absorption and detector response reduce the detected signal."},{"id":"C","text":"Whether the incident electrons can excite the relevant transition."},{"id":"D","text":"Whether a visually bright SEM region guarantees that every elemental line must be detected."}],"answers":["A","B","C"],"explanation":"C 对：激发能量不足会使相关线不出现。A 对：重叠与背景可掩盖弱信号。B 对：吸收、窗口和探测响应都可能减弱检测。D 错：图像亮度不保证每一元素峰必然可见；阴性结果需要先检查方法能力和条件。\n\n重点词：detection（检测）；background（背景）；absorption（吸收）\n逻辑链：信号必须先产生、再逃逸、再被探测并从背景中辨认 → 任一环节受限都可导致弱/缺峰 → 不能直接等同于元素不存在。","source":{"file":"Electron Spectroscopy; Aberration-corrected STEM","page":"Spectroscopy pp.22,25,32,40,42,52; STEM p.6"},"difficulty":"进阶"},{"id":"CMP-017","chapter":"综合比较 · Principles & applications","type":"multiple","prompt":"Which explanations of a bright feature are physically plausible in the indicated mode?","options":[{"id":"A","text":"A crystalline region contributes to the selected diffraction beam in DF-TEM."},{"id":"B","text":"The brightness changes with focus through phase interference in conventional HRTEM."},{"id":"C","text":"A heavy-element region produces stronger backscattering in a comparable BSE measurement."},{"id":"D","text":"An edge gives more escaping secondary electrons in SE imaging."}],"answers":["A","B","C","D"],"explanation":"D 对：边缘增强可来自逃逸几何而非成分。C 对：较强核散射可增加BSE信号。A 对：暗场亮度可与是否满足被选衍射条件有关。B 对：相位干涉对比随离焦变化，不能把这些模式的亮都解释成同一个化学原因。\n\n重点词：escape geometry（逃逸几何）；selected reflection（选定反射）；phase interference（相位干涉）\n逻辑链：同样表现为亮 → 先查看检测模式 → 再分别考虑几何、核散射、衍射条件或相位干涉。","source":{"file":"SEM; TEM","page":"SEM pp. 39,40,41; TEM pp. 47,50,53"},"difficulty":"进阶"},{"id":"CMP-018","chapter":"综合比较 · Principles & applications","type":"multiple","prompt":"Why is the comparison between DIC and HRTEM useful?","options":[{"id":"A","text":"Their shared interference principle means that specimen preparation and application limits are identical."},{"id":"B","text":"Both can convert phase differences into intensity contrast through interference."},{"id":"C","text":"HRTEM contrast can arise from interference between transmitted and diffracted electron waves."},{"id":"D","text":"They must use the same wavelength and the same type of lens."}],"answers":["B","C"],"explanation":"B 对：老师Tutorial要求抓住相位差经干涉变成强度差的共同链条。D 错：一个使用光，一个使用电子，装置不同。C 对：HRTEM让不同电子束干涉形成相位对比。A 错：共同原理不取消透射、厚度和环境等条件差异。\n\n重点词：phase difference（相位差）；interference（干涉）；intensity contrast（强度对比）\n逻辑链：样品造成相位差 → 波相互干涉 → 强度发生差异；共通的逻辑不等于相同的设备或适用范围。","source":{"file":"TEM; Electron Spectroscopy","page":"TEM pp. 27,28,52,55; Spectroscopy pp. 11"},"difficulty":"进阶"},{"id":"CMP-019","chapter":"综合比较 · Principles & applications","type":"multiple","prompt":"What is gained by recording a spectrum at each scan position instead of only one detector intensity?","options":[{"id":"A","text":"Different spectral regions can answer different questions, such as elemental distribution or low-loss electronic information."},{"id":"B","text":"Stored spectra can be used to extract different chemical information while preserving spatial location."},{"id":"C","text":"A total-intensity image can always recover an unrecorded spectrum after acquisition."},{"id":"D","text":"Recording spectra removes the need to distinguish spatial resolution from spectral resolution."}],"answers":["A","B"],"explanation":"B 对：逐点能谱同时保存位置和能量维度。C 错：未记录的能量信息不能从一个总强度值普遍恢复。A 对：谱的不同区域与物理过程关联，能提取不同信息。D 错：能否分开位置与能否分开能量仍是两个独立限制。\n\n重点词：spectrum imaging（谱像）；energy dimension（能量维度）；spatial association（空间关联）\n逻辑链：每点保存完整能谱 → 可按谱区选择所需信号 → 得到相应信息的空间分布，而非只有一幅总强度图。","source":{"file":"Aberration-corrected STEM; Electron Spectroscopy","page":"STEM pp. 41,42,43; Spectroscopy pp. 38,39,49"},"difficulty":"进阶"},{"id":"CMP-020","chapter":"综合比较 · Principles & applications","type":"multiple","prompt":"Which control–effect matches are correct?","options":[{"id":"A","text":"Reducing the scanned area can increase displayed SEM magnification without necessarily shrinking the physical probe."},{"id":"B","text":"Increasing electron flux can improve counting statistics but cannot replace insufficient excitation energy per electron."},{"id":"C","text":"Improving electron optics can improve probe localization without automatically improving an X-ray detector’s energy resolution."},{"id":"D","text":"Increasing displayed magnification alone corrects lens aberrations and separates overlapping spectral peaks."}],"answers":["A","B","C"],"explanation":"A 对：扫描区域与显示放大有关，但不必改变真实探针尺寸。C 对：探针空间能力与探测器谱分辨应区分。B 对：电子数与单电子能量是不同控制量。D 错：显示缩放不改变透镜物理和能谱峰形。\n\n重点词：magnification（放大倍数）；probe size（探针尺寸）；counting statistics（计数统计）\n逻辑链：先判断限制发生在空间、能量还是统计维度 → 调整对应物理控制 → 不把更大显示图像或更多电子当万能改善。","source":{"file":"SEM; Aberration-corrected STEM","page":"SEM pp.20,21,22,36,37,50; STEM pp.31,37"},"difficulty":"进阶"},{"id":"CMP-021","chapter":"综合比较 · New applications","type":"multiple","prompt":"EDS, WDS and EELS can all respond to core excitation. Which comparisons are correct?","options":[{"id":"A","text":"An EELS ionization edge can have a different shape because it samples excitation into available electronic states."},{"id":"B","text":"Improving WDS line separation makes its measured quantity identical to a transmitted-electron energy-loss spectrum."},{"id":"C","text":"EDS and WDS can detect the same characteristic X-rays while resolving nearby lines differently."},{"id":"D","text":"A shared initial core excitation requires every detector to record the same symmetric spectral feature."}],"answers":["A","C"],"explanation":"C 对：EDS/WDS检测特征X射线，分光方式和谱分辨能力不同。B 错：分峰改善不把光子谱变成电子能损谱。A 对：EELS涉及电子进入可用空态，边形可含电子态信息。D 错：相同初始激发可以对应不同后续被测过程，老师Tutorial要求解释的正是这一差别。\n\n重点词：characteristic line（特征线）；energy loss（能量损失）；available states（可用态）\n逻辑链：相同核心激发 → 区分随后测发射光子还是束电子能损 → 再解释谱形及信息，不能只按共同起点类比所有结果。","source":{"file":"Electron Spectroscopy; Aberration-corrected STEM","page":"Spectroscopy pp.18–19,34–35,45–46; STEM p.7"},"difficulty":"进阶","batch":"新增应用题"},{"id":"CMP-022","chapter":"综合比较 · New applications","type":"multiple","prompt":"DIC and HRTEM share phase-contrast logic, but a thin interface is buried under another layer. Which arguments guide method selection?","options":[{"id":"A","text":"A suitable cross-section can make the buried interface accessible to transmission imaging."},{"id":"B","text":"An elemental spectrum alone necessarily provides the geometric thickness of the buried interface."},{"id":"C","text":"The common interference principle guarantees that the two instruments can examine the same geometry without different preparation."},{"id":"D","text":"HRTEM can provide fine structural detail when a suitable electron-transparent specimen contains the interface."}],"answers":["A","D"],"explanation":"C 错：共通的相位—干涉原理不等于相同信号路径和制样要求。A 对：老师的埋藏氧化层Tutorial关键是让截面包含目标界面。D 对：足够薄且包含目标的样品配合HRTEM可回答细结构问题。B 错：元素信息与界面几何厚度并非同一物理量。\n\n重点词：buried interface（埋藏界面）；cross-section（截面）；phase contrast（相位对比）\n逻辑链：先定位目标界面及所需信息 → 选择能暴露目标的几何与制样 → 再利用相位对比获得结构，而非只凭共同原理选设备。","source":{"file":"TEM; Electron Spectroscopy","page":"TEM pp.15,20–21,27,52–55; Spectroscopy pp.7,11"},"difficulty":"进阶","batch":"新增应用题"},{"id":"CMP-023","chapter":"综合比较 · New applications","type":"multiple","prompt":"A specimen changes during repeated electron-microscope observations. Which interpretations remain valid across the lecture examples?","options":[{"id":"A","text":"A time sequence automatically proves that the beam has no influence on the observed process."},{"id":"B","text":"ESEM charge neutralization prevents every possible type of beam-induced change."},{"id":"C","text":"Beam-induced deposition, damage or loss of crystalline order can affect what is measured."},{"id":"D","text":"A change in morphology or diffraction can require checking whether irradiation altered the specimen."}],"answers":["C","D"],"explanation":"A 错：连续观察本身也意味着持续照射，不能自动排除测量干扰。B 错：中和电荷只处理一个机制，不取消加热、损伤或束致反应。D 对：SEM伪影、ESEM反应序列与TEM照射非晶化都提醒要检查测量是否改变样品。C 对：这些变化会影响后续图像或结构判断，不应不加区分地当作初始状态。\n\n重点词：irradiation（照射）；beam-induced change（束致变化）；initial state（初始状态）\n逻辑链：重复测量同时带来电子照射 → 可能改变表面、化学过程或有序性 → 解释动态前先区分原有过程与束引入的变化。","source":{"file":"SEM; TEM","page":"SEM pp.44,48; TEM p.41"},"difficulty":"进阶","batch":"新增应用题"},{"id":"CMP-024","chapter":"综合比较 · New applications","type":"multiple","prompt":"A non-conductive specimen is coated before SEM-EDS analysis. Which considerations follow from the preparation and spectroscopy principles?","options":[{"id":"A","text":"Preventing charging makes all detected characteristic lines originate only from the original specimen."},{"id":"B","text":"The coating may help provide a conductive path and reduce charging."},{"id":"C","text":"Coating choice and the desired chemical information should be considered together."},{"id":"D","text":"The coating is material exposed to the beam and may contribute characteristic X-ray signals of its own."}],"answers":["B","C","D"],"explanation":"B 对：合适导电层与接地路径有助于电荷泄放。D 对：由镀层作为样品表面材料以及EDS原子激发发射原理联合推得，镀层也可能贡献信号；不是只要仪器稳定便能忽略。A 错：解决充电不等于排除了镀层或其他材料的化学贡献。C 对：制样满足成像条件的同时，也要考虑它是否影响待回答的化学问题。\n\n重点词：conductive coating（导电镀层）；characteristic X-ray（特征X射线）；signal contribution（信号贡献）\n逻辑链：为抑制充电而加入导电材料 → 新材料也处于电子束作用下 → 解释元素谱时必须同时考虑原样品与制样引入的贡献。","source":{"file":"SEM; Electron Spectroscopy","page":"SEM pp.23–24,33; Spectroscopy pp.18–19,25"},"difficulty":"进阶","batch":"新增应用题"}]},"./data/demo.json":{"version":1,"title":"操作示例 · 非 MLE5216 课程题目","questions":[{"id":"demo-001","chapter":"操作示例","type":"single","prompt":"这组操作示例题可以用来做什么？","options":[{"id":"A","text":"熟悉选择、提交答案和查看解析的流程"},{"id":"B","text":"预测 MLE5216 考试原题"},{"id":"C","text":"代替尚未上传的课程课件"},{"id":"D","text":"作为老师提供的标准题库"}],"answers":["A"],"explanation":"操作示例仅用于体验练习程序。正式课程题目将在收到课件后整理，并附上课件来源与页码。","source":null,"difficulty":"基础"},{"id":"demo-002","chapter":"操作示例","type":"multiple","prompt":"一道多选题的正确答案是 A、C。哪些作答会被判为错误？","options":[{"id":"A","text":"只选 A，漏掉 C"},{"id":"B","text":"选择 <script type="module">const {validateBank,isCorrect,buildSession} = (() => {
/** Pure question-bank validation and quiz logic. No browser state is used here. */
const LIMITS = Object.freeze({ questions: 5000, options: 12, short: 120, prompt: 12000, option: 4000, explanation: 16000 });

function fail(message) {
  throw new Error(`题库格式错误：${message}`);
}

function object(value, label) {
  if (!value || typeof value !== 'object' || Array.isArray(value)) fail(`${label}必须是对象。`);

function string(value, label, max, allowEmpty = false) {

/** Validate and copy an untrusted imported JSON bank into the supported schema. */
function validateBank(raw) {
