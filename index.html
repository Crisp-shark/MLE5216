<script type="application/json" id="inline-banks">{"./data/questions.json":{"version":1,"title":"MLE5216 · 四份课件精练题库","questions":[{"id":"SEM-001","chapter":"SEM","type":"multiple","prompt":"Which statements correctly describe the capabilities and information provided by SEM?","options":[{"id":"A","text":"A BSE image provides the same quantitative chemical information as an elemental spectrum."},{"id":"B","text":"Its spatial resolution and large depth of field are useful for studying rough surface morphology."},{"id":"C","text":"SEM replaces the focused light beam of a scanning optical microscope with a focused electron beam."},{"id":"D","text":"A surface image by itself determines both the topography and the complete elemental composition."}],"answers":["B","C"],"explanation":"C（正确）：两者都可逐点扫描，但SEM探针是电子而不是光。B（正确）：高空间分辨能力与大景深有助于看清粗糙表面不同高度的结构。D（错误）：形貌图不能自动提供完整元素组成，成像通道决定信息类型。A（错误）：BSE能提示成分反差，真正的化学鉴定和定量仍需适当谱学。\n\n重点词：focused electron beam（聚焦电子束）；depth of field（景深）；topography（形貌）。\n逻辑链：聚焦电子束逐点探测 → 信号形成表面图像 → 高空间分辨与大景深有利于观察形貌，但不能自动给出完整化学组成。","source":{"file":"SEM","page":"PDF pp. 17, 18, 49"},"difficulty":"基础"},{"id":"SEM-002","chapter":"SEM","type":"multiple","prompt":"Why does a shorter electron wavelength not guarantee finer practical detail in SEM?","options":[{"id":"A","text":"In a bulk specimen, higher-energy electrons can spread farther sideways before generating the measured signal."},{"id":"B","text":"Raising beam energy shortens the electron wavelength and improves the diffraction-only expectation."},{"id":"C","text":"A voltage setting must balance the wavelength benefit against the size of the signal-generating region."},{"id":"D","text":"The detector assigns every detected electron to the same physical point where it was generated, so lateral spreading cannot blur an image."}],"answers":["A","B","C"],"explanation":"B（正确）：高束能使波长缩短，这是瑞利分辨率思路中的有利因素。A（正确）：但常规SEM厚样品内的相互作用体积可随束能增大，横向扩展使信号不再只来自束斑下极小区域。D（错误）：图像按入射束的扫描位置赋值，不能将来自较宽区域的信号重新定位到其真实产生点。C（正确）：实际选束能要平衡短波长与横向扩展等限制，不是越高越好。\n\n重点词：wavelength（波长）；interaction volume（相互作用体积）；lateral spread（横向扩展）。\n逻辑链：束能升高 → 波长变短，同时厚样品内横向扩展可能增大 → 实际分辨率取决于两者及其他限制的平衡。","source":{"file":"SEM","page":"PDF pp. 20, 36, 37, 50; TEM PDF p.6"},"difficulty":"进阶","tutorial":"SEM Tutorial Q2"},{"id":"SEM-003","chapter":"SEM","type":"multiple","prompt":"Which SEM component–function matches are correct?","options":[{"id":"A","text":"Condenser lenses: control electron illumination; objective lens: controls focus and influences resolution."},{"id":"B","text":"Electron gun: supplies electrons; accelerator: sets beam energy and influences interaction depth."},{"id":"C","text":"Scan coils: control beam position and scanned area, thereby affecting magnification."},{"id":"D","text":"Detectors and readout: associate measured signal intensity with raster positions to construct the image."}],"answers":["A","B","C","D"],"explanation":"B（正确）：电子枪是电子源；加速器设置动能，进而影响电子进入材料的深度。\nA（正确）：课件分别把聚光镜对应电子照明，把物镜对应聚焦和分辨率。\nC（正确）：计算机通过扫描线圈偏转束斑，控制逐点扫描的位置及视场大小。\nD（正确）：探测强度与扫描位置同步，每个位置的信号构成一个像素，由控制读出系统形成图像。\n\n重点词：electron gun（电子枪）；scan coils（扫描线圈）；objective lens（物镜）。\n逻辑链：电子源供束、加速器定束能 → 透镜聚焦与扫描线圈定位 → 探测器把位置相关强度交给读出系统形成图像。","source":{"file":"SEM","page":"PDF pp. 21, 22"},"difficulty":"基础"},{"id":"SEM-004","chapter":"SEM","type":"multiple","prompt":"Which statements about SEM raster acquisition are supported by the lecture?","options":[{"id":"A","text":"A slower scan can improve signal-to-noise ratio by allowing more signal collection at each position."},{"id":"B","text":"The frame is assembled serially, although raster acquisition can still be fast."},{"id":"C","text":"In the illustrated raster, flyback contributes image data in the same way as the forward scan."},{"id":"D","text":"All raster positions must be exposed simultaneously before any pixel intensity is recorded."}],"answers":["A","B"],"explanation":"B（正确）：SEM逐点建立像素，逐点采集仍可实现较快成像。A（正确）：较慢扫描允许每个位置积累更多信号，可改善信噪比。C（错误）：课件示意中有效数据来自正向扫描，回扫应与之区分。D（错误）：逐点扫描不是全视场同时曝光，每个位置的强度随束斑扫描获得。\n\n重点词：raster scan（光栅扫描）；dwell（驻留）；signal-to-noise ratio（信噪比）。\n逻辑链：束斑逐点驻留采集 → 每点信号构成像素 → 适当放慢扫描可提高信号积累与信噪比。","source":{"file":"SEM","page":"PDF p. 22"},"difficulty":"基础"},{"id":"SEM-005","chapter":"SEM","type":"multiple","prompt":"An operator surveys a large specimen and then zooms into one feature. Which interpretations are justified?","options":[{"id":"A","text":"Changing the scan area necessarily changes the kinetic energy of every electron."},{"id":"B","text":"SEM navigation is restricted to the same small fixed field in the way described for scanning-probe exploration."},{"id":"C","text":"Reducing the scanned specimen area at fixed display size increases magnification, without itself guaranteeing newly resolved detail."},{"id":"D","text":"Increasing displayed magnification alone removes the specimen interaction-volume limit."}],"answers":["C"],"explanation":"C（正确）：扫描范围变小会增大显示倍率，但样品内横向扩展等分辨率限制仍在；倍率不等于新增空间信息。\nB（错误）：课件把容易放大、缩小和移动至其他位置作为SEM相对SPM大范围探索的优势。\nA（错误）：扫描区域由扫描线圈控制，束能由加速器设置，是不同控制量。\nD（错误）：把图像放大不能缩小信号的物理来源区域，也不会自动分辨更细结构。\n\n重点词：magnification（放大倍数）；resolution（分辨率）；field of view（视场）。\n逻辑链：扫描范围缩小、显示尺寸不变 → 倍率提高 → 物理信号范围并未因此缩小，新增细节仍受分辨率限制。","source":{"file":"SEM","page":"PDF pp. 18, 21, 22, 36"},"difficulty":"进阶"},{"id":"SEM-006","chapter":"SEM","type":"multiple","prompt":"Which statements distinguish beam current, beam energy and their practical consequences?","options":[{"id":"A","text":"Reducing current can reduce beam damage but may make the image noisier."},{"id":"B","text":"Beam energy concerns individual-electron kinetic energy; changing it can affect wavelength and surface sensitivity."},{"id":"C","text":"Increasing current at fixed energy increases the electron arrival rate without changing what energy per electron means."},{"id":"D","text":"Increasing current and increasing accelerating voltage are interchangeable ways of shortening the wavelength."}],"answers":["A","B","C"],"explanation":"C（正确）：电流对应单位时间内到达的电子数；束能固定时增加电流不等于每个电子能量增加。B（正确）：加速电压影响电子动能、波长以及样品内相互作用，进而影响表面敏感性。A（正确）：减少入射电子可降低损伤，但同时减少有效信号，产生信号与样品保护的取舍。D（错误）：电流控制电子数量，束能控制单电子能量，二者不能互相替代。\n\n重点词：beam current（束流）；beam energy（束能）；beam damage（束流损伤）。\n逻辑链：电流改变电子到达数量，束能改变单电子动能 → 信号、波长与相互作用分别改变 → 需要按成像质量和样品耐受性取舍。","source":{"file":"SEM","page":"PDF pp. 20, 42, 44, 50（PDF p.44印刷页脚误标48/50）；SEM教程解答及电流噪声图：TEM PDF p. 8"},"difficulty":"进阶","tutorial":"SEM Tutorial Q4"},{"id":"SEM-007","chapter":"SEM","type":"multiple","prompt":"Which relationships between beam energy, specimen material and interaction volume are correct?","options":[{"id":"A","text":"The smallest interaction volume is the only factor that determines the final SEM resolution."},{"id":"B","text":"A larger nuclear charge can deflect electrons more strongly and give a smaller interaction volume."},{"id":"C","text":"For the same bulk material, increasing beam energy can increase penetration and lateral spreading."},{"id":"D","text":"Changing specimen composition cannot change electron trajectories if the accelerating voltage is fixed."}],"answers":["B","C"],"explanation":"C（正确）：同种厚样品中，高能电子通常深入更深、横向扩展更大。B（正确）：核电荷较大时对快电子的偏转更强，是材料影响相互作用体积的原因。D（错误）：束能相同也不能忽略样品元素、核电荷带来的散射差别。A（错误）：小相互作用体积有利于局域信号，但波长、束斑和电子光学等仍可能限制分辨率。\n\n重点词：nuclear charge（核电荷）；penetration（穿透）；interaction volume（相互作用体积）。\n逻辑链：束能和材料核电荷共同影响电子轨迹 → 穿透深度与横向扩展改变 → 信号局域性和实际分辨率随之改变。","source":{"file":"SEM","page":"PDF pp. 36, 37；相关教程解答：TEM PDF p. 6"},"difficulty":"进阶"},{"id":"SEM-008","chapter":"SEM","type":"multiple","prompt":"Which statements correctly identify the secondary-electron signal?","options":[{"id":"A","text":"SE are incident beam electrons elastically turned back near sample nuclei."},{"id":"B","text":"The positive charge of the SE detector pushes secondary electrons away from it."},{"id":"C","text":"SE retain energies comparable to the primary beam and therefore directly sample the same deeper region as BSE."},{"id":"D","text":"SE are low-energy specimen electrons that mainly escape from a shallow region near the surface."}],"answers":["D"],"explanation":"D（正确）：入射束激发样品价带或芯能级电子，低能SE只能从靠近自由表面的很浅区域容易逃出。A（错误）：这是BSE的来源；SE来自受激发的样品电子。C（错误）：SE能量低、直接逃逸浅；较高能量和较深信号来源对应BSE。B（错误）：负电子被正探测器吸引，不是排斥。\n\n重点词：secondary electrons, SE（二次电子）；escape depth（逃逸深度）；surface-sensitive（表面敏感）。\n逻辑链：入射束激发样品电子 → 低能SE难从深处逃逸 → 探测到的SE主要反映浅表面信息。","source":{"file":"SEM","page":"PDF pp. 38, 39"},"difficulty":"基础"},{"id":"SEM-009","chapter":"SEM","type":"multiple","prompt":"Why can edges and corners appear bright in an SE image of a chemically uniform rough surface?","options":[{"id":"A","text":"A larger fraction of the interaction region is close to an accessible free surface at an edge."},{"id":"B","text":"More low-energy SE can escape and reach the detector, producing topographic contrast."},{"id":"C","text":"The brightness proves that the edges must contain heavier elements than the flat regions."},{"id":"D","text":"Edge enhancement requires SE to escape directly from every point throughout the full primary-beam interaction volume."}],"answers":["A","B"],"explanation":"A（正确）：转角、斜坡和侧壁增加邻近自由表面的体积比例。\nB（正确）：SE逃逸深度浅，侧面提供额外逃逸机会，形成边缘增强和三维形貌感。\nC（错误）：即使组成均匀，几何形貌也足以增强SE边缘亮度，不能据此认定重元素。\nD（错误）：初级束相互作用体积与低能SE直接逃逸深度不是同一量；只有靠近自由表面的SE容易逃出。\n\n重点词：edge enhancement（边缘增强）；free surface（自由表面）；topographic contrast（形貌对比）。\n逻辑链：边角具有侧面自由表面 → 更多浅层SE有机会逃逸并被收集 → 即使成分均匀，边缘也可较亮。","source":{"file":"SEM","page":"PDF pp. 39, 50；边、角、斜坡几何图及解答：TEM PDF p. 5"},"difficulty":"进阶","tutorial":"SEM Tutorial Q1"},{"id":"SEM-010","chapter":"SEM","type":"multiple","prompt":"Which statements describe backscattered electrons and their sampling region?","options":[{"id":"A","text":"Their relatively high energies allow a deeper sampling region than the low-energy SE signal."},{"id":"B","text":"BSE originate in the incident beam and can be turned back by strong interaction near specimen nuclei."},{"id":"C","text":"The nuclear backscattering process taught here requires almost all electron kinetic energy to be lost."},{"id":"D","text":"BSE are newly emitted valence electrons rather than incident electrons."}],"answers":["A","B"],"explanation":"B（正确）：BSE是入射束电子，受样品正核电荷作用发生强偏转后部分返回。A（正确）：BSE通常保有较高能量，其信号来源比SE更深；这里重点是相对深浅，不要求背诵固定深度。D（错误）：将BSE误认为受激发的低能样品电子。C（错误）：课件主要以弹性核散射解释BSE，高动能可以保留，并非必须几乎耗尽。\n\n重点词：backscattered electrons, BSE（背散射电子）；elastic scattering（弹性散射）；nucleus（原子核）。\n逻辑链：入射束电子接近样品核 → 较强核电场使部分电子大角度返回且保有较高能量 → BSE来源与SE的受激发低能电子不同。","source":{"file":"SEM","page":"PDF pp. 38, 40"},"difficulty":"基础"},{"id":"SEM-011","chapter":"SEM","type":"multiple","prompt":"Why can BSE images distinguish regions of different composition?","options":[{"id":"A","text":"A larger nuclear proton number can increase backscattering and produce composition-dependent intensity."},{"id":"B","text":"SE and BSE images of the same region can emphasize different properties: surface shape and composition."},{"id":"C","text":"BSE contrast is chemical because the detected BSE are emitted from the core levels of sample atoms."},{"id":"D","text":"A single BSE grey value uniquely identifies an element without additional chemical information."}],"answers":["A","B"],"explanation":"A（正确）：元素核电荷不同会影响入射电子被散回的概率，所以不同成分可产生BSE灰度差。D（错误）：灰度可提示差异，但精确元素鉴定需要适当谱学或其他证据。B（正确）：SE以形貌信息为主，BSE有成分相关反差，二者互补。C（错误）：BSE仍来自入射束，化学敏感性来自它们与样品核相互作用的概率，而非样品芯电子发射。\n\n重点词：atomic number（原子序数）；backscattering probability（背散射概率）；chemical contrast（化学对比）。\n逻辑链：核正电荷随元素改变 → 背散射概率与强度改变 → BSE显示成分相关对比，但精确元素身份仍需谱学验证。","source":{"file":"SEM","page":"PDF pp. 40, 41, 49, 50；核散射化学反差解答：TEM PDF p. 9"},"difficulty":"进阶","tutorial":"SEM Tutorial Q5"},{"id":"SEM-012","chapter":"SEM","type":"multiple","prompt":"Which distinctions are needed when interpreting beam-energy and aperture changes?","options":[{"id":"A","text":"A smaller aperture and convergence angle can increase depth of field."},{"id":"B","text":"Because SE directly escape only from a shallow layer, their image contrast cannot depend on the deeper interaction-volume changes caused by beam energy."},{"id":"C","text":"Changing beam energy can change SE contrast without proving that the specimen topography changed."},{"id":"D","text":"Depth of field is defined by the deepest penetration point of the primary beam."}],"answers":["A","C"],"explanation":"C（正确）：p42的氧化钒纳米管例子说明成像条件本身可明显改变反差；低束能更表面敏感。\nA（正确）：p43的几何图显示小会聚角使更大高度范围保持清晰，这是SEM大景深的重要关系。\nD（错误）：景深是样品不同高度保持清晰的范围，不是材料内部电子穿透深度。\nB（错误）：低能SE的直接逃逸区域与初级束相互作用体积应区分；p42明确展示束能改变仍会影响SE图像。\n\n重点词：surface sensitivity（表面敏感性）；convergence angle（会聚角）；depth of field（景深）。\n逻辑链：束能改变相互作用和表面敏感性，孔径改变会聚角 → 对比与清晰高度范围可分别改变 → 不应将景深、穿透深度和横向分辨率混为一谈。","source":{"file":"SEM","page":"PDF pp. 38, 39, 42, 43"},"difficulty":"进阶"},{"id":"SEM-013","chapter":"SEM","type":"multiple","prompt":"Which specimen-preparation choices are supported by the lecture?","options":[{"id":"A","text":"A grounded conductive base, connected using silver paint, graphite paint or carbon tape, can drain charge; carbon tape can also support powders."},{"id":"B","text":"Non-conductive bulk specimens often need a thin carbon or metal coating, commonly applied by sputter coating."},{"id":"C","text":"Dry bulk and powder samples are usable, but specimen height should still be checked to avoid instrument damage."},{"id":"D","text":"Polymer or biological specimens may require heavy-metal staining for useful contrast."}],"answers":["A","B","C","D"],"explanation":"A（正确）：这些材料提供导电接触，碳胶带同时可承载粉末；机械固定与排电路径都应考虑。\nB（正确）：碳、金或其他金属薄层可减少成像充电；不是每个样品都必须采用同一材料或厚度。\nD（正确）：染色针对反差需求，应与为排电而做的导电镀层区分。\nC（正确）：课件明确列出可用样品形态，并要求高度检查；镀膜或使用胶带不取消机械安全要求。\n\n重点词：grounding（接地）；conductive coating（导电镀层）；staining（染色）。\n逻辑链：样品导电性与所需对比不同 → 分别选择排电连接、导电镀层或染色 → 减少充电并提供所需反差，同时仍检查样品高度。","source":{"file":"SEM","page":"PDF pp. 23, 24"},"difficulty":"基础"},{"id":"SEM-014","chapter":"SEM","type":"multiple","prompt":"Which steps belong to the conventional SEM workflow shown in the lecture?","options":[{"id":"A","text":"Use the chamber camera and stage to position the sample relative to the objective, then pump down before imaging."},{"id":"B","text":"A high-magnification image should replace the initial overview, because magnification alone guarantees safe specimen positioning."},{"id":"C","text":"Begin with a low-magnification overview, center the region of interest, and perform voltage, focus, aperture and astigmatism adjustments."},{"id":"D","text":"Vent for specimen exchange and use gloves to help keep the vacuum environment clean."}],"answers":["A","C","D"],"explanation":"D（正确）：换样先放气，戴手套减少残留污染；随后送回样品并重新建立合适真空。\nA（正确）：相机辅助观察样品与物镜的相对位置，样品台可移动或转动；空气分子会散射电子，所以常规案例抽真空成像。\nC（正确）：这是p27的导航及主要调整流程；各调整有不同控制目的。\nB（错误）：高倍率不替代全貌导航和高度检查；初始低倍率视野便于找到并居中目标。\n\n重点词：venting（放气）；vacuum（真空）；region of interest（目标区域）。\n逻辑链：换样后重新建立真空并安全定位 → 低倍率寻找和居中目标 → 逐项完成束能、聚焦和对准调整后观察细节。","source":{"file":"SEM","page":"PDF pp. 25, 26, 27, 34"},"difficulty":"基础"},{"id":"SEM-015","chapter":"SEM","type":"multiple","prompt":"An SEM image shifts sideways through focus, while another develops perpendicular elongations. Which diagnoses are correct?","options":[{"id":"A","text":"Perpendicular elongations call for the stigmator, a multipole adjustment that reshapes an oval beam toward a circular beam."},{"id":"B","text":"Ordinary refocusing alone removes the cause of both symptoms without any alignment change."},{"id":"C","text":"The two symptoms establish the same fault, so aperture centering always replaces stigmator adjustment."},{"id":"D","text":"Rigid focus-dependent image shift calls for checking aperture centering."}],"answers":["A","D"],"explanation":"D（正确）：p28把调焦时整体横向移动与孔径偏心相对应。\nA（正确）：像散使欠焦、过焦拉长方向互相垂直；消像散器改变电子束形状。\nC（错误）：孔径偏心与像散是不同失准，不能互换诊断和校正。\nB（错误）：穿焦观察的目的正是发现对中或像散问题，仅把图像调到某焦点不等于消除原因。\n\n重点词：aperture centering（孔径对中）；astigmatism（像散）；stigmator（像散校正器）。\n逻辑链：穿焦时观察整体平移或正交拉伸 → 区分孔径偏心与像散 → 分别对中孔径或调整stigmator。","source":{"file":"SEM","page":"PDF pp. 28, 29"},"difficulty":"进阶"},{"id":"SEM-016","chapter":"SEM","type":"multiple","prompt":"Why is optical microscopy followed by SEM a useful workflow for a delicate biological surface?","options":[{"id":"A","text":"Reflection light microscopy can provide an initial survey, while SEM reveals finer surface structure."},{"id":"B","text":"Accumulated negative charge attracts and stabilizes the negative electron beam."},{"id":"C","text":"A conductive contact and an appropriate thin coating can help charge leave a non-conductive specimen."},{"id":"D","text":"Views of fine three-dimensional structure can help investigate an optical function without directly identifying a pigment."}],"answers":["A","C","D"],"explanation":"A（正确）：课件蝶翼案例先用光学明场看整体鳞片，再用SEM看更细结构，体现分辨能力和视场的互补。C（正确）：导电安装与合适镀层减少电荷积累，作用是排电，不是要求背诵特定案例厚度。B（错误）：积累负电会排斥负电子束，引起闪烁或扫描畸变。D（正确）：细微三维结构可与光扩散等功能联系，但SEM形貌图本身不等同于颜料的化学鉴定。\n\n重点词：reflection bright field（反射明场）；conductive coating（导电镀层）；light diffuser（光扩散结构）。\n逻辑链：光镜定位整体结构 → 导电安装与合适镀层帮助SEM稳定观察细节 → 三维形貌可用于理解光学功能，但不直接鉴定化学色素。","source":{"file":"SEM","page":"PDF pp. 31, 32, 33, 34, 35"},"difficulty":"进阶"},{"id":"SEM-017","chapter":"SEM","type":"multiple","prompt":"Which interpretations of changes in previously scanned regions are justified?","options":[{"id":"A","text":"A hydrocarbon residue can polymerize under irradiation, so avoiding organic residue addresses contamination."},{"id":"B","text":"Polymer swelling or shrinkage, heating and etching can be beam damage; reducing beam current is the suggested remedy."},{"id":"C","text":"A persistent dark patch does not by itself prove charging rather than contamination or physical damage."},{"id":"D","text":"Conductive grounding alone removes the organic residue responsible for irradiation-induced contamination."}],"answers":["A","B","C"],"explanation":"B（正确）：课件将这些现象列为束流损伤，明确建议降低电流。\nA（正确）：污染是表面残留在电子束下发生聚合，与电荷简单积累或调焦失准不同。\nC（正确）：课件展示多种已扫描区域伪影，应结合机制判断，不能只按一个明暗症状作唯一归因。\nD（错误）：接地改善排电，不能自动去除烃类残留；不同伪影需要针对性措施。\n\n重点词：beam damage（束损伤）；hydrocarbon（烃类）；contamination（污染）。\n逻辑链：束流可改变材料，也可使残留烃聚合 → 扫描区出现形变或污染痕迹 → 按机制降低束流、保持清洁，而非只靠接地。","source":{"file":"SEM","page":"PDF p. 44（PDF p.44印刷页脚误标48/50）"},"difficulty":"进阶"},{"id":"SEM-018","chapter":"SEM","type":"multiple","prompt":"An insulating specimen flickers and the scan is distorted. Which proposals address the charging mechanism?","options":[{"id":"A","text":"Provide a path for accumulated electrons to leave, or use suitable ESEM charge neutralization when coating is unsuitable."},{"id":"B","text":"Use conductive coating only to improve focus, because charge accumulation cannot deflect a beam."},{"id":"C","text":"Treat the distortion as proof of aperture decentering, even if it is unrelated to changing focus."},{"id":"D","text":"Switch from SE to BSE detection and assume that unchanged specimen preparation can no longer charge."}],"answers":["A"],"explanation":"A（正确）：非导电区域负电积累可排斥束流；接地/导电层用于排电，ESEM则通过正气体离子中和，适用于不能镀膜等情况。\nD（错误）：换探测通道并不建立电荷排流或中和机制，不能保证消除充电。\nC（错误）：孔径偏心的特征是图像随调焦移动；充电畸变不能无条件套用该诊断。\nB（错误）：导电镀层的关键用途是减少电荷积累，而积累负电正可改变入射束轨迹。\n\n重点词：charging（充电）；charge drainage（电荷排流）；distortion（畸变）。\n逻辑链：绝缘表面无法及时排走入射电荷 → 负电积累偏转电子束 → 导电通路或合适ESEM中和可减轻畸变。","source":{"file":"SEM","page":"PDF pp. 23, 24, 33, 44, 46（PDF p.44印刷页脚误标48/50）（PDF pp.45–48印刷页脚为44–47/50）"},"difficulty":"进阶"},{"id":"SEM-019","chapter":"SEM","type":"multiple","prompt":"Which statements correctly describe the ESEM pressure arrangement?","options":[{"id":"A","text":"Most of the column stays under vacuum, while pressure-limiting apertures and differential pumping allow gas near the sample."},{"id":"B","text":"Pressure-limiting apertures actively pump away gas, so pumping between them is unnecessary."},{"id":"C","text":"ESEM succeeds by eliminating every interaction between electrons and gas molecules."},{"id":"D","text":"The electron gun, column and sample must all be at unrestricted ambient pressure."}],"answers":["A"],"explanation":"A（正确）：ESEM不是整台仪器处于室内气压：通过限压孔及其间差分抽气，使样品附近可处于较差真空甚至环境压力。\nD（错误）：这忽略了ESEM维持区域间压力差及保护电子束传播条件的结构。\nB（错误）：孔径限制气体流通，抽走气体仍依赖差分抽气，两者功能不同。\nC（错误）：气体仍与电子相互作用，而且后续正离子中和机制正依赖气体被电离。\n\n重点词：pressure-limiting aperture（限压孔）；differential pumping（差分抽气）；gas environment（气体环境）。\n逻辑链：孔径限制气体流通，孔间抽气维持压力差 → 样品附近可保留较高气压而柱体保持真空 → 环境观察与电子束传播条件得以兼顾。","source":{"file":"SEM","page":"PDF p. 45（PDF pp.45–48印刷页脚为44–47/50）"},"difficulty":"基础"},{"id":"SEM-020","chapter":"SEM","type":"multiple","prompt":"Which steps in ESEM surface-charge neutralization are correct?","options":[{"id":"A","text":"The negatively charged specimen attracts the positive ions."},{"id":"B","text":"Negative gas ions must add more negative charge to the specimen for neutralization to occur."},{"id":"C","text":"SE and BSE emitted from the specimen can ionize nearby gas and generate positive ions."},{"id":"D","text":"The positive SE detector repels positive ions toward the specimen, helping them neutralize accumulated negative charge."}],"answers":["A","C","D"],"explanation":"C（正确）：课件把两类出射电子均列为气体电离来源，正气体离子随后参与中和。\nA（正确）：异号电荷相吸，正离子向被束流充成负电的表面移动。\nD（正确）：探测器的正电排斥和样品的负电吸引共同促进正离子朝样品漂移。\nB（错误）：这把中和物种和电荷符号倒置；本讲机制是正离子抵消表面负电。\n\n重点词：gas ionization（气体电离）；positive ions（正离子）；neutralization（中和）。\n逻辑链：出射SE/BSE电离气体 → 正离子受样品吸引并被正探测器排向样品 → 正离子抵消表面积累的负电。","source":{"file":"SEM","page":"PDF p. 46（PDF pp.45–48印刷页脚为44–47/50）"},"difficulty":"基础"},{"id":"SEM-021","chapter":"SEM","type":"multiple","prompt":"Which applications are supported by the ESEM examples?","options":[{"id":"A","text":"Observing uncoatable archaeological material when finer spatial detail than optical microscopy is required."},{"id":"B","text":"In-situ observation of wet materials and real-time gas/liquid/solid interactions."},{"id":"C","text":"An insulating ceramic must always receive a metal coating even when effective ESEM ion neutralization is available."},{"id":"D","text":"Imaging a non-conducting ceramic or the illustrated unstained di-block copolymer without the usual charging preparation."}],"answers":["A","B","D"],"explanation":"B（正确）：课件明确列出湿态原位观察及动态界面过程，并以水泥相关需求举例。\nA（正确）：不能镀膜是ESEM适用理由；教程同时强调相对光镜需要更高分辨率时的选择。\nD（正确）：示例包含非导电陶瓷以及无染色的共聚物层片，说明环境模式扩展样品适用性，并非宣称任何样品都无需准备。\nC（错误）：气体正离子中和允许部分非导电表面不镀导电层，这是ESEM的重要优势。\n\n重点词：in situ（原位）；vacuum-sensitive（真空敏感）；uncoatable（不可镀膜）。\n逻辑链：样品需湿态、不能承受常规真空或不能镀膜，同时需要高空间分辨 → 选择适合的ESEM条件 → 扩展常规SEM难处理样品的可观察范围。","source":{"file":"SEM","page":"PDF pp. 45, 47, 50（PDF pp.45–48印刷页脚为44–47/50）；相对光镜选择的教程解答：TEM PDF p. 7"},"difficulty":"进阶","tutorial":"SEM Tutorial Q3"},{"id":"SEM-022","chapter":"SEM","type":"multiple","prompt":"What can environmental electron microscopy reveal during a wet, changing experiment?","options":[{"id":"A","text":"Using ESEM ensures that an electron beam cannot cause a chemical transformation in liquid."},{"id":"B","text":"Electron-beam-induced reduction can produce metal deposits, so the observation may alter the process being observed."},{"id":"C","text":"Repeated images of the same region can follow hydration or other gas–liquid–solid changes over time."},{"id":"D","text":"A BSE image sequence directly gives calibrated concentrations of every dissolved species."}],"answers":["B","C"],"explanation":"C（正确）：课件盐晶体吸水例子表明同一区域连续成像可追踪动态变化。B（正确）：另一例中束流诱导溶液中金属离子还原沉积，说明测量条件可能参与过程。A（错误）：环境模式扩展样品适用性，不保证束流化学惰性。D（错误）：BSE记录散射强度变化，不自动构成全部溶解物种的定量分析。\n\n重点词：time series（时间序列）；hydration（水合）；beam-induced reduction（束流诱导还原）。\n逻辑链：环境条件下重复观察同一区域 → 可跟踪液体相关变化，同时束流可能参与化学反应 → 解释动态结果时需考虑测量对样品的影响。","source":{"file":"SEM","page":"PDF p. 48（PDF pp.45–48印刷页脚为44–47/50）"},"difficulty":"进阶"},{"id":"SEM-023","chapter":"SEM","type":"multiple","prompt":"Which criteria are appropriate when selecting a technique from the lecture overview?","options":[{"id":"A","text":"Every boundary in the overview chart is a guaranteed specification for all instruments and samples."},{"id":"B","text":"The desired information—surface shape, local composition or a real chemical characterization—matters in addition to spatial resolution."},{"id":"C","text":"Analytical spot size and concentration detection range are separate performance dimensions; the smallest spot need not give the lowest detection limit."},{"id":"D","text":"The technique with the greatest displayed magnification must be optimal for every material and measurement."}],"answers":["B","C"],"explanation":"C（正确）：总览图分别比较空间定位与检测浓度范围，不能由一个维度最佳推出另一个也最佳。\nB（正确）：SEM应用及总结区分形貌、BSE成分反差和谱学表征，选技术应先明确问题。\nD（错误）：倍率不等于分辨率，也不能代替检测限、信号类型或样品兼容性要求。\nA（错误）：图表示不同技术的概括能力范围，不能当作所有设置和样品的硬性保证。\n\n重点词：analytical spot size（分析区域尺寸）；detection limit（检测限）；information content（信息类型）。\n逻辑链：先明确所需信息与空间/浓度范围 → 再比较设备信号和样品条件 → 不能只按倍率或单一性能选仪器。","source":{"file":"SEM","page":"PDF pp. 15, 18, 49"},"difficulty":"进阶"},{"id":"SEM-024","chapter":"SEM","type":"multiple","prompt":"A rough composite has bright edges in SE, bright inclusions in BSE, and less fine detail at higher voltage. Which interpretations are reasonable?","options":[{"id":"A","text":"A shorter wavelength at higher voltage prevents lateral spreading from reducing image detail."},{"id":"B","text":"Composition-dependent backscattering can make an inclusion bright, but its exact identity still needs chemical evidence."},{"id":"C","text":"Edge geometry can enhance SE escape even where composition is uniform."},{"id":"D","text":"The different observations should be interpreted through their signal mechanisms rather than one universal brightness rule."}],"answers":["B","C","D"],"explanation":"C（正确）：边缘提供更多靠近自由表面的SE逃逸路径。B（正确）：核电荷相关散射可产生BSE成分反差，但灰度不是唯一元素标签。A（错误）：短波长和更大横向扩展可以同时发生，后者可使实际细节变差。D（正确）：SE、BSE及束能变化分别涉及不同逻辑，不能把所有亮处都当成同一种信息。\n\n重点词：signal mechanism（信号机制）；topography（形貌）；composition（成分）。\n逻辑链：观察SE边缘、BSE夹杂与高束能细节变化 → 分别联系逃逸几何、核散射与横向展宽 → 避免用同一亮度规则解释全部现象。","source":{"file":"SEM","page":"PDF pp. 36, 37, 39, 40, 41, 42, 49"},"difficulty":"进阶"},{"id":"SEM-025","chapter":"SEM","type":"multiple","prompt":"Which task–method matches are supported by the SEM lecture?","options":[{"id":"A","text":"Choose the method with the largest displayed magnification without considering the required information."},{"id":"B","text":"Assume a scanning-probe instrument and SEM offer the same ease of surveying a large specimen."},{"id":"C","text":"Use SEM for large-area exploration with easy changes of position and magnification."},{"id":"D","text":"Use a light-microscope overview to locate a region before investigating finer surface detail with SEM."}],"answers":["C","D"],"explanation":"D（正确）：光镜整体定位与SEM精细形貌可以互补，课件蝶翼案例就是这种流程。C（正确）：容易缩放和移动视场是课件强调的SEM应用优势。B（错误）：课件把大范围探索方便作为SEM相对SPM的一项优势，不能假定二者导航范围与方式相同。A（错误）：应先确定形貌、成分或动态观察任务，倍率本身不是选设备的充分依据。\n\n重点词：survey（概览）；complementary methods（互补方法）；surface structure（表面结构）。\n逻辑链：先确定位置与目标尺度 → 光镜概览和SEM细节观察相互补充 → 依据任务而非最高显示倍率安排测量流程。","source":{"file":"SEM","page":"PDF pp. 17, 18, 31, 32, 35"},"difficulty":"进阶"},{"id":"SEM-026","chapter":"SEM","type":"multiple","prompt":"A conventional SEM image of a fragile polymer becomes noisy after current is reduced. Which responses address the stated trade-off?","options":[{"id":"A","text":"Raising beam energy is identical to restoring the previous electron arrival rate."},{"id":"B","text":"A slower scan can collect more signal per position and improve signal-to-noise ratio."},{"id":"C","text":"Increasing display magnification alone supplies the missing detected electrons."},{"id":"D","text":"Reducing current can protect the specimen, while the acquisition settings must still provide enough useful signal."}],"answers":["B","D"],"explanation":"B（正确）：更慢扫描增加每点的信号采集，可改善噪声，但仍需留意样品受到的照射。A（错误）：束能改变单电子能量，不等于改变每秒电子数。D（正确）：降低电流减轻损伤与保持足够信号之间存在取舍，应按目标协调采集条件。C（错误）：图像显示放大不能补充未采集到的电子信号。\n\n重点词：electron arrival rate（电子到达率）；dwell time（驻留时间）；signal-to-noise ratio（信噪比）。\n逻辑链：降电流减轻损伤但减少信号 → 调整扫描采集时间以改善统计 → 同时关注信号质量与样品受到的照射。","source":{"file":"SEM","page":"PDF pp. 22, 44, 50"},"difficulty":"进阶"},{"id":"SEM-027","chapter":"SEM","type":"multiple","prompt":"A specimen must remain wet and cannot receive a conductive coating. When is ESEM a justified choice over light microscopy?","options":[{"id":"A","text":"Gas near the specimen can support charge neutralization of an insulating surface."},{"id":"B","text":"The experiment needs spatial detail beyond light microscopy while preserving a suitable wet environment."},{"id":"C","text":"The mere presence of water makes ESEM preferable even if an optical method already answers the question."},{"id":"D","text":"Choosing ESEM removes the need to consider what information the detector actually measures."}],"answers":["A","B"],"explanation":"B（正确）：Tutorial强调湿态或真空敏感样品同时需要比光镜更高空间分辨时，可选ESEM。A（正确）：合适气体产生的正离子可中和样品负电，使不宜镀膜的绝缘表面也可能成像。C（错误）：湿态不是自动选择ESEM的充分条件；光镜若已满足观察目标，应结合任务取舍。D（错误）：ESEM改变样品环境与充电条件，SE/BSE等信号的信息边界仍在。\n\n重点词：wet-state imaging（湿态成像）；charge neutralization（电荷中和）；spatial resolution（空间分辨率）。\n逻辑链：先判断湿态与不可镀膜约束 → 再判断光镜能否满足所需空间信息 → 需要更细信息时考虑ESEM及其正确的信号解释。","source":{"file":"SEM","page":"PDF pp. 45, 46, 47, 50"},"difficulty":"进阶"},{"id":"SEM-028","chapter":"SEM","type":"multiple","prompt":"A coating improves the stability of an SEM image, but a scanned area still changes irreversibly. Which conclusions are justified?","options":[{"id":"A","text":"A stable image proves that the specimen remains physically and chemically unchanged."},{"id":"B","text":"Charging, contamination and beam damage are different mechanisms and may need different remedies."},{"id":"C","text":"Improved charge drainage can reduce flicker without preventing all beam damage."},{"id":"D","text":"Hydrocarbon contamination can still polymerize under the beam, so cleanliness remains important."}],"answers":["B","C","D"],"explanation":"C（正确）：导电层解决电荷排流，不能保证聚合物形变、加热或刻蚀等损伤消失。D（正确）：表面烃残留可在照射下聚合，接地并不会自动清除它们。A（错误）：成像稳定仅说明某些畸变受到控制，不证明测量绝不改变样品。B（正确）：应按电荷、残留物与材料受束作用的机制分别诊断。\n\n重点词：charging（充电）；contamination（污染）；irreversible change（不可逆变化）。\n逻辑链：导电处理改善电荷稳定性 → 但束流损伤和残留物反应仍可继续 → 图像稳定不等于样品不被改变。","source":{"file":"SEM","page":"PDF pp. 23, 24, 33, 44"},"difficulty":"进阶"},{"id":"SEM-029","chapter":"SEM","type":"multiple","prompt":"A rough fracture surface has high and low regions that cannot all be kept sharp. Which response addresses this imaging requirement?","options":[{"id":"A","text":"A larger depth of field proves that the detected electrons come from deeper inside the specimen."},{"id":"B","text":"Increasing displayed magnification alone extends the physical range that remains in focus."},{"id":"C","text":"A smaller convergence angle can increase the range of specimen heights that remain in focus."},{"id":"D","text":"Changing from SE to BSE detection automatically brings all specimen heights into focus."}],"answers":["C"],"explanation":"C（正确）：课件把较小孔径/会聚角与较大景深联系起来，这直接针对粗糙表面不同高度是否同时清晰。A（错误）：景深描述离焦容许的高度范围，不等于电子的穿透或信号采样深度。D（错误）：SE/BSE选择改变收集的信号，不自动代替电子光学聚焦条件。B（错误）：显示放大不改变实际景深。\n\n重点词：depth of field（景深）；convergence angle（会聚角）；sampling depth（采样深度）。\n逻辑链：表面高度起伏 → 不同部位偏离最佳焦平面 → 通过合适的会聚角扩大清晰高度范围，而不是把景深误当成穿透深度。","source":{"file":"SEM","page":"PDF pp. 21, 38, 43"},"difficulty":"进阶","batch":"新增应用题"},{"id":"SEM-030","chapter":"SEM","type":"multiple","prompt":"Bulk specimens with different compositions are imaged at the same beam energy. Which interpretations of their signals are justified?","options":[{"id":"A","text":"Equal accelerating voltage guarantees the same interaction volume in every specimen material."},{"id":"B","text":"A larger nuclear charge can influence both the interaction volume and the amount of backscattering."},{"id":"C","text":"A material-dependent change in electron spreading can occur without a change in lens alignment."},{"id":"D","text":"Stronger deflection by nuclei with more protons can make the interaction volume smaller."}],"answers":["B","C","D"],"explanation":"A（错误）：相互作用体积不仅取决于束能，还取决于样品材料，不能由电压相同推出采样区域相同。D（正确）：课件指出较重元素的核质子更多，对快电子偏转较强，可形成较小相互作用体积。C（正确）：材料本身已是散射差异的原因，不必先假定仪器失准。B（正确）：核电荷既影响轨迹展宽，也影响返回的BSE比例；这是材料与成分相关反差的联系。\n\n重点词：nuclear charge（核电荷）；electron deflection（电子偏转）；interaction volume（相互作用体积）。\n逻辑链：材料组成改变 → 电子与原子核相互作用不同 → 轨迹分布及背散射信号可改变，即使束能和仪器对准保持不变。","source":{"file":"SEM","page":"PDF pp. 37, 40"},"difficulty":"进阶","batch":"新增应用题"},{"id":"SEM-031","chapter":"SEM","type":"multiple","prompt":"A conductive coating and an ESEM gas environment are considered for an insulating surface. Which comparisons are correct?","options":[{"id":"A","text":"In ESEM, positive gas ions can neutralize negative charge on the irradiated surface."},{"id":"B","text":"Suppressing charging by either approach does not turn an intensity image into complete chemical characterization."},{"id":"C","text":"Suitable ESEM conditions can be useful when the original surface must not receive a conductive coating."},{"id":"D","text":"A suitable coating connected to ground can provide a route for accumulated charge to leave."}],"answers":["A","B","C","D"],"explanation":"D（正确）：镀层与接地连接提供电荷泄放路径，关键是建立导电联系。A（正确）：ESEM通过电子电离气体产生正离子，吸引至负电样品表面以中和电荷。C（正确）：老师给出不能镀膜的样品作为ESEM应用，方法选择取决于原始表面是否允许改动。B（正确）：解决充电是改善成像条件，完整化学表征仍需相应能谱信息。\n\n重点词：conductive path（导电路径）；gas-ion neutralization（气体离子中和）；chemical characterization（化学表征）。\n逻辑链：先识别负电荷积累 → 选择导电泄放或正离子中和 → 获得较稳定图像；再按信息需求决定是否另做化学谱学。","source":{"file":"SEM","page":"PDF pp. 23–24, 45–47, 49"},"difficulty":"进阶","batch":"新增应用题"},{"id":"SEM-032","chapter":"SEM","type":"multiple","prompt":"A suspected buried feature is not visible in a surface SE image. Which conclusions or next steps are justified?","options":[{"id":"A","text":"If the task requires a cross-sectional view of a buried layer, an appropriately prepared TEM specimen can address that different information need."},{"id":"B","text":"BSE can sample deeper than SE, but this does not guarantee access to a feature at any possible depth."},{"id":"C","text":"Increasing display magnification makes the SE signal directly sample the buried feature."},{"id":"D","text":"Its absence from the SE image proves that no such feature exists anywhere in the bulk specimen."}],"answers":["A","B"],"explanation":"D（错误）：SE主要反映近表面浅层；一种信号中看不见，不能直接推出整个块体中不存在。B（正确）：BSE通常比低能SE的采样区域更深，但仍有有限的相互作用和信号形成区域，不是任意深度的探针。C（错误）：显示放大不改变信号产生和逃逸的物理区域。A（正确）：TEM可通过合适薄截面观察内部层结构，须按埋藏结构这一信息需求选择制样与透射几何。\n\n重点词：surface sensitivity（表面敏感性）；buried feature（埋藏特征）；cross-sectional TEM（截面透射电镜）。\n逻辑链：先判断目标是否处于当前信号可采样的区域 → 阴性图像不能越过方法边界作结论 → 必要时更换采样几何并制备合适截面。","source":{"file":"SEM; TEM","page":"SEM PDF pp. 38–40,49; TEM PDF pp. 15–20"},"difficulty":"进阶","batch":"新增应用题"},{"id":"TEM-001","chapter":"TEM · Principles & applications","type":"multiple","prompt":"Which statements correctly describe the information and practical limits of TEM?","options":[{"id":"A","text":"Suitable specimen holders allow observations during heating or electrical stressing."},{"id":"B","text":"A TEM projection is a direct map of the exposed surface height of a thick specimen."},{"id":"C","text":"TEM can examine different areas and magnifications, but thin-specimen preparation and operation can be more demanding than SEM."},{"id":"D","text":"A cross-sectional TEM specimen can reveal buried interfaces and thin-film thickness."}],"answers":["A","C","D"],"explanation":"D：正确。截面让埋藏的层与界面进入透射观察方向。B：错误。TEM看穿样品，不直接把投影强度变成表面高度。C：正确。TEM也能导航和放大缩小，代价是更复杂的制样与操作。A：正确。原位研究需要适合该实验的专用样品杆，不能认为每支普通样品杆都自动具备这些功能。\n\n重点词：cross section（截面）；transmission（透射）；in situ（原位）\n逻辑链：研究埋藏结构 → 制作可透电子的截面 → 观察层厚与界面；研究动态过程 → 配置合适样品杆 → 在受控刺激下记录变化。","source":{"file":"TEM","page":"PDF pp. 15–18,54"},"difficulty":"基础"},{"id":"TEM-002","chapter":"TEM · Principles & applications","type":"multiple","prompt":"Why can TEM reveal finer details than conventional bulk-sample SEM?","options":[{"id":"A","text":"A thin specimen reduces the lateral spreading that broadens the signal-generating region in a bulk sample."},{"id":"B","text":"The transmitted electrons are measured below a thin specimen rather than only collecting reflection-side signals above a thick specimen."},{"id":"C","text":"A larger interaction volume is the main reason for the finer details."},{"id":"D","text":"The higher electron energy normally used in TEM gives a shorter electron wavelength."}],"answers":["A","B","D"],"explanation":"B：正确。透射几何配合薄样品，使TEM和常规SEM具有不同的信号路径和作用区域。D：正确。较高动能缩短电子波长，有利于分辨细节，但不是唯一条件。A：正确。薄样品减少横向散射，局域信息不易被较大作用体积混合。C：错误。横向作用区域扩大通常使细节变模糊；不能用“作用体积更大”解释TEM优势。\n\n重点词：lateral spread（横向展宽）；interaction volume（相互作用体积）；wavelength（波长）\n逻辑链：薄样品 → 横向散射减少 → 信号更局域；较高束能 → 波长缩短 → 有利于更高空间分辨。不能只比较显示放大倍数。","source":{"file":"TEM; Electron Spectroscopy","page":"TEM PDF pp.17–19,55; Spectroscopy PDF p.9"},"difficulty":"进阶","tutorial":"TEM Tutorial Q3"},{"id":"TEM-003","chapter":"TEM · Sample preparation","type":"multiple","prompt":"Which preparation choices are appropriate for dispersed nanoparticles in TEM?","options":[{"id":"A","text":"A particle suspension can be drop-cast onto a thin carbon or silicon-nitride support film."},{"id":"B","text":"A conductive support makes an arbitrarily thick particle suitable for transmission imaging."},{"id":"C","text":"A support grid carrying the specimen is mounted in a holder that enters the microscope vacuum."},{"id":"D","text":"The particles and support must allow enough electrons to pass through the region of interest."}],"answers":["A","C","D"],"explanation":"D：正确。关键要求是电子透明，而不是背诵一个对所有材料通用的厚度上限。B：错误。导电性与电子透明性是不同要求，导电并不能取消透射限制。A：正确。这是课件给出的颗粒样品简便路线。C：正确。支撑网与样品杆承载薄样品并将其送入真空中的观察位置。\n\n重点词：electron transparency（电子透明性）；drop-casting（滴涂）；support film（支撑膜）\n逻辑链：颗粒分散并滴涂 → 颗粒落在薄支撑膜上 → 观察区可透射电子；厚度要求不能由导电支撑替代。","source":{"file":"TEM","page":"PDF pp. 20,22"},"difficulty":"基础"},{"id":"TEM-004","chapter":"TEM · Sample preparation","type":"multiple","prompt":"When is FIB preparation particularly justified instead of less expensive mechanical thinning?","options":[{"id":"A","text":"The question requires a site-specific buried interface or local failure region."},{"id":"B","text":"A particular small device feature must be included in the TEM cross-section."},{"id":"C","text":"Mechanical preparation is unsuitable whenever the final observation region must be thin."},{"id":"D","text":"FIB is the best choice for every specimen because its main advantage is lower cost."}],"answers":["A","B"],"explanation":"B、A：正确。FIB的关键优势是位点特异，能把目标小结构准确放入截面。C：错误。机械切磨、中心减薄及离子减薄也能得到可透电子的样品。D：错误。课件强调FIB昂贵；“更能选点”不等于“普遍更便宜”。不需要精确选点时，可考虑机械路线。\n\n重点词：site-specific（位点特异）；focused ion beam（聚焦离子束）；failure analysis（失效分析）\n逻辑链：目标是特定局部小结构 → 需要精确选点 → FIB有价值；只需代表性截面 → 可采用机械制样与后续离子减薄。","source":{"file":"TEM; Electron Spectroscopy","page":"TEM PDF pp.20–21,55; Spectroscopy PDF p.10"},"difficulty":"进阶","tutorial":"TEM Tutorial Q4"},{"id":"TEM-005","chapter":"TEM · Sample preparation","type":"multiple","prompt":"Which descriptions of the dual-beam FIB lift-out process are correct?","options":[{"id":"A","text":"The lamella is secured before being released and transferred, and it must still be thinned for electron transmission."},{"id":"B","text":"Local Pt deposition can connect a lamella to a manipulator and later to its support."},{"id":"C","text":"The Ga+ ion beam mills the specimen while the electron beam helps locate and observe the target."},{"id":"D","text":"For a suitable non-site-specific sample, cutting, grinding, dimpling and ion milling provide another thinning route."}],"answers":["A","B","C","D"],"explanation":"C：正确。双束系统把切削与观察分工。B：正确。局部沉积Pt用于连接，操纵针完成薄片转移。A：正确。先固定再释放可保留目标薄片；转移并不意味着已完成最终减薄。D：正确。机械路线与FIB都必须最终满足电子透明性，只是选点能力和成本不同。\n\n重点词：lamella（薄片）；lift-out（提取）；ion milling（离子减薄）\n逻辑链：观察定位目标 → 离子切削并固定薄片 → 转移到支撑网 → 继续减薄至可透电子。","source":{"file":"TEM","page":"PDF pp.20–22"},"difficulty":"进阶"},{"id":"TEM-006","chapter":"TEM · Sources & coherence","type":"multiple","prompt":"Which comparisons of the electron sources listed in the lecture are correct?","options":[{"id":"A","text":"LaB6 is a field emitter, while the tungsten field emitter is a thermionic source."},{"id":"B","text":"The inexpensive tungsten hairpin filament has better coherence than the listed field emitter."},{"id":"C","text":"Increasing displayed image magnification makes the source coherence irrelevant."},{"id":"D","text":"The field emitter offers the best coherence and resolution among the listed sources, at higher cost."}],"answers":["D"],"explanation":"A：错误。LaB6属于热电子发射源，钨场发射源依靠场发射。C：错误。显示放大不能改变源尺寸、相干性或探针质量。D：正确。课件把场发射源与较好的相干性和分辨能力联系起来，同时指出其成本更高。B：错误。钨发夹丝低价，但不能因此推成相干性最好。\n\n重点词：thermionic emission（热电子发射）；field emission（场发射）；coherence（相干性）\n逻辑链：选择电子源 → 决定束流质量与相干条件 → 影响可形成的探针及相位成像能力；显示倍率不能补偿源质量。","source":{"file":"TEM","page":"PDF pp.23–26"},"difficulty":"基础"},{"id":"TEM-007","chapter":"TEM · Sources & coherence","type":"multiple","prompt":"Which statements correctly connect coherence with the electron beam?","options":[{"id":"A","text":"A small source favours spatial, or directional, coherence."},{"id":"B","text":"Both spatial and temporal coherence are useful when electron-wave interference is used for phase imaging."},{"id":"C","text":"Stable acceleration conditions help maintain consistent electron energies and temporal coherence."},{"id":"D","text":"High spatial coherence automatically guarantees high temporal coherence."}],"answers":["A","B","C"],"explanation":"A：正确。较小源尺寸有助于方向关系一致。C：正确。稳定加速条件减少电子能量与频率的变化，有利于时间相干。D：错误。课件展示两种相干性可以独立变化。B：正确。只检查方向而忽略时间相位关系，或反过来，都不是完整的相干条件。\n\n重点词：spatial coherence（空间相干性）；temporal coherence（时间相干性）；phase（相位）\n逻辑链：小源尺寸 → 方向更一致；稳定能量 → 时间相位关系更稳定；两者配合 → 干涉对比更可靠。","source":{"file":"TEM","page":"PDF pp.24–26"},"difficulty":"进阶"},{"id":"TEM-008","chapter":"TEM · Sources & coherence","type":"multiple","prompt":"What do DIC and HRTEM have in common when forming image contrast?","options":[{"id":"A","text":"Their common phase-contrast logic means that they use identical radiation and specimen requirements."},{"id":"B","text":"Both techniques form their images by collecting surface secondary electrons."},{"id":"C","text":"The specimen introduces phase differences into the illuminating waves."},{"id":"D","text":"Interference converts those phase differences into measurable intensity differences."}],"answers":["C","D"],"explanation":"C、D：正确。这正是老师Tutorial要求抓住的共同逻辑：样品改变相位，波干涉再把相位差转为明暗。B：错误。DIC使用光，HRTEM使用透射电子波，都不是SEM二次电子图。A：错误。机制有相似处不等于所用波、光路、制样要求完全相同。\n\n重点词：phase difference（相位差）；interference（干涉）；intensity contrast（强度对比）\n逻辑链：样品引入相位差 → 波发生相长/相消干涉 → 探测到强度差 → 形成图像明暗。共同机制不等于相同适用范围。","source":{"file":"TEM; Electron Spectroscopy","page":"TEM PDF pp.27,55; Spectroscopy PDF p.11"},"difficulty":"进阶","tutorial":"TEM Tutorial Q5"},{"id":"TEM-009","chapter":"TEM · Diffraction & crystallography","type":"multiple","prompt":"Which statements explain diffraction from a periodic array of atoms illuminated by coherent electrons?","options":[{"id":"A","text":"The direct beam is the forward direction in which the waves can also add constructively."},{"id":"B","text":"Every intermediate direction has the same constructive intensity as a diffraction maximum."},{"id":"C","text":"Each atom acts as a point-like scatterer in the Huygens construction."},{"id":"D","text":"Specific directions have constructive interference because scattered waves have matching phases."}],"answers":["A","C","D"],"explanation":"C：正确。单个原子向不同方向散射电子波。D：正确。多原子散射波在特定方向同相叠加，形成衍射极大。A：正确。直射方向也满足课件所示的相长条件。B：错误。不满足相长条件的中间方向可出现相消，不能认为所有方向一样强。\n\n重点词：Huygens principle（惠更斯原理）；constructive interference（相长干涉）；destructive interference（相消干涉）\n逻辑链：原子散射电子波 → 周期排列决定各方向相位差 → 特定方向同相增强、其他方向削弱 → 形成衍射图样。","source":{"file":"TEM","page":"PDF pp.28–31"},"difficulty":"基础"},{"id":"TEM-010","chapter":"TEM · Diffraction & crystallography","type":"multiple","prompt":"Which qualitative consequences of Bragg diffraction are correct?","options":[{"id":"A","text":"The beam-deflection angle and the angle between the incident beam and the crystal planes are interchangeable."},{"id":"B","text":"A larger diffraction angle directly means that the crystal grains are physically larger."},{"id":"C","text":"At fixed wavelength and reflection order, more closely spaced planes diffract to a larger angle."},{"id":"D","text":"At fixed plane spacing, using a shorter wavelength necessarily increases the diffraction angle."}],"answers":["C"],"explanation":"C：正确。固定波长和级次时，晶面间距与散射角呈反向关系。D：错误。固定间距时，波长缩短对应更小的Bragg角，不能把间距关系套到波长上。A：错误。课件几何中Bragg角与总束偏转角不同，不能互换；理解光路比死记代入更重要。B：错误。衍射角主要反映晶面间距及条件，不是晶粒尺寸的放大坐标。\n\n重点词：Bragg diffraction（布拉格衍射）；lattice spacing（晶面间距）；scattering angle（散射角）\n逻辑链：固定波长与反射条件 → 晶面间距变小 → 相长干涉出现于更大散射角 → 图样反映结构周期而非晶粒外形。","source":{"file":"TEM","page":"PDF pp.32,36–38"},"difficulty":"进阶"},{"id":"TEM-011","chapter":"TEM · Diffraction & crystallography","type":"multiple","prompt":"Which interpretations of TEM diffraction patterns are justified?","options":[{"id":"A","text":"A central dark shape may be a beam stop protecting the camera rather than a specimen feature."},{"id":"B","text":"A diffraction ring is the intersection of a diffracted cone with the detector plane."},{"id":"C","text":"A ring radius directly traces the real-space boundary of a particle."},{"id":"D","text":"A single crystal can produce discrete spots, while many orientations can produce sharp rings."}],"answers":["A","B","D"],"explanation":"D：正确。参与衍射的晶粒数与取向分布影响斑点、稀疏斑点或环的出现。B：正确。多取向的同一散射角形成锥面，与相机平面相交为环。C：错误。衍射环记录角度和周期性信息，粒子边界应看实空间像。A：正确。必须把挡束器等仪器结构与样品结构区分。\n\n重点词：single crystal（单晶）；polycrystalline（多晶）；beam stop（挡束器）\n逻辑链：晶体取向分布不同 → 相长散射方向分布不同 → 形成斑点或锐环；先辨仪器部件，再解释样品。","source":{"file":"TEM","page":"PDF pp.33,35"},"difficulty":"基础"},{"id":"TEM-012","chapter":"TEM · Diffraction & crystallography","type":"multiple","prompt":"When using a TEM diffraction pattern to compare lattice spacings, which statements are justified?","options":[{"id":"A","text":"Changing camera length changes the real lattice spacing of an unchanged specimen."},{"id":"B","text":"Electron diffraction necessarily measures lattice parameters more precisely than X-ray diffraction."},{"id":"C","text":"The wavelength and camera geometry must be known or calibrated before interpreting spot positions quantitatively."},{"id":"D","text":"At the same wavelength and camera settings, a reflection farther from the direct beam corresponds to a larger plane spacing."}],"answers":["C"],"explanation":"D：错误。相同设置下，离中心更远表示更大散射角，对应更小而非更大的晶面间距。B：错误。课件复习明确指出电子衍射测晶体结构参数的精度低于XRD；局部分析优势不等于参数精度最高。A：错误。相机长度改变图样几何缩放，并不改变样品晶格。C：正确。同一半径在不同设置下不能未经校准就比较成相同间距。\n\n重点词：camera length（相机长度）；calibration（校准）；lattice parameter（晶格参数）\n逻辑链：已知波长与相机几何 → 将斑点位置关联到散射角与晶面间距；改变显示几何 ≠ 改变真实晶格。","source":{"file":"TEM; Electron Spectroscopy","page":"TEM PDF pp.37–38; Spectroscopy PDF p.3"},"difficulty":"进阶"},{"id":"TEM-013","chapter":"TEM · Diffraction & crystallography","type":"multiple","prompt":"Why is indexing needed after lattice spacings have been obtained?","options":[{"id":"A","text":"Symmetry-equivalent plane families in a cubic crystal must have different spacings."},{"id":"B","text":"The same set of allowed reflections can be assumed for every crystal structure."},{"id":"C","text":"It associates reflections with particular crystal planes rather than leaving them as unassigned distances."},{"id":"D","text":"Measuring one spacing automatically identifies every crystal phase without considering possible alternatives."}],"answers":["C"],"explanation":"C：正确。知道间距之后仍需回答“它属于哪组晶面”，这就是索引的意义。A：错误。立方晶体的对称等价面可共享间距，不能把每个方向变化都当作新相。D：错误。不同候选结构可能有相近间距，需要更多反射及整体一致性。B：错误。fcc、bcc及其他晶系具有不同反射关系。\n\n重点词：indexing（索引）；Miller indices（密勒指数）；equivalent planes（等价晶面）\n逻辑链：测得衍射位置 → 得到间距 → 匹配晶面与允许反射 → 综合判断晶体结构；不能只靠一个未标定距离。","source":{"file":"TEM","page":"PDF pp.39–40"},"difficulty":"进阶"},{"id":"TEM-014","chapter":"TEM · Diffraction & crystallography","type":"multiple","prompt":"Which reasoning helps distinguish candidate crystal structures from diffraction?","options":[{"id":"A","text":"Compare the pattern of observed spacings and allowed reflections with the candidate structures."},{"id":"B","text":"Assume that any pattern containing rings must have the same crystal structure."},{"id":"C","text":"Require several reflections to be consistent with one structural interpretation."},{"id":"D","text":"Treat a larger pattern on the camera as proof that a different phase has formed, without checking camera settings."}],"answers":["A","C"],"explanation":"A：正确。课件用不同立方结构的反射关系说明相识别逻辑，不必靠背一串数值完成判断。B：错误。环说明取向叠加，不直接指定晶相。C：正确。多条反射的一致性比单条相似间距更可靠。D：错误。相机几何也会改变图样尺度，应先排除设置变化。\n\n重点词：crystal phase（晶相）；allowed reflection（允许反射）；consistency（一致性）\n逻辑链：提出候选结构 → 比较多条间距及反射关系 → 检查是否共同一致 → 支持或排除晶相；先控制几何再比较。","source":{"file":"TEM","page":"PDF pp.37–40"},"difficulty":"进阶"},{"id":"TEM-015","chapter":"TEM · Diffraction & crystallography","type":"multiple","prompt":"A region changes from sharp diffraction features to broad diffuse rings during irradiation. Which interpretations are justified?","options":[{"id":"A","text":"The original specimen must already have been amorphous because any diffraction ring proves disorder."},{"id":"B","text":"The later pattern can indicate a loss of long-range crystalline order."},{"id":"C","text":"Broad diffuse rings establish the elemental composition without spectroscopy."},{"id":"D","text":"Irradiation may have changed the specimen, so the final pattern should not automatically be assigned to its initial state."}],"answers":["B","D"],"explanation":"B：正确。课件把锐斑或锐环与晶态联系，把宽弥散环与非晶状态联系。A：错误。多晶也可出现锐环，应区分锐环和弥散环。D：正确。测量过程可能改变样品，必须区分初始状态与照射后状态。C：错误。衍射首先提供结构有序性信息，不直接代替元素谱。\n\n重点词：amorphous（非晶）；diffuse ring（弥散环）；beam-induced change（束致变化）\n逻辑链：照射使结构有序性下降 → 相干衍射特征变宽/弥散 → 图样变化；必须检查测量是否改变被测对象。","source":{"file":"TEM","page":"PDF pp.41,54–55"},"difficulty":"进阶"},{"id":"TEM-016","chapter":"TEM · Image formation & apertures","type":"multiple","prompt":"How does switching TEM from imaging mode to diffraction mode change what is recorded?","options":[{"id":"A","text":"The objective back-focal plane, rather than the ordinary specimen image plane, is projected onto the camera."},{"id":"B","text":"The selected-area aperture replaces the camera and records the electrons itself."},{"id":"C","text":"The specimen image is merely enlarged digitally until it becomes a diffraction pattern."},{"id":"D","text":"Changing beam current alone selects a different physical plane for projection onto the camera."}],"answers":["A"],"explanation":"C：错误。数字放大不改变被投影的物理平面。A：正确。衍射模式显示方向/角度信息，成像模式显示样品实空间像。D：错误。束流改变不等于投影平面切换；课件通过调节中间镜强度选择投影平面。B：错误。选区光阑筛选区域，不是记录探测器。\n\n重点词：back-focal plane（后焦面）；image plane（像平面）；intermediate lens（中间镜）\n逻辑链：调节中间镜 → 改变投影到相机的平面 → 在实空间图像与衍射角分布之间切换。","source":{"file":"TEM","page":"PDF pp.42–43"},"difficulty":"进阶"},{"id":"TEM-017","chapter":"TEM · Image formation & apertures","type":"multiple","prompt":"Which aperture–function matches are correct?","options":[{"id":"A","text":"The selected-area and objective apertures select the same variable and are interchangeable."},{"id":"B","text":"A selected-area aperture restricts which specimen region contributes to a diffraction pattern."},{"id":"C","text":"Movable holes in a metal strip are physical means of selecting an aperture size and position."},{"id":"D","text":"An objective aperture selects electron beams in the diffraction plane and therefore affects the imaging mode."}],"answers":["B","C","D"],"explanation":"B：正确。选区光阑在像平面选哪块样品。D：正确。物镜光阑在后焦/衍射平面选哪些电子束。C：正确。光阑是可移动的实体孔，操作改变其接受范围。A：错误。一个选空间区域，一个选散射方向，位置与功能不能互换。\n\n重点词：selected-area aperture（选区光阑）；objective aperture（物镜光阑）；beam selection（选束）\n逻辑链：要选样品位置 → 用像平面选区光阑；要选直射或衍射束 → 用衍射平面物镜光阑 → 决定成像信息。","source":{"file":"TEM","page":"PDF pp.42–44"},"difficulty":"进阶"},{"id":"TEM-018","chapter":"TEM · Imaging modes & applications","type":"multiple","prompt":"Which statements correctly describe bright-field TEM?","options":[{"id":"A","text":"The objective aperture accepts the central direct beam and excludes scattering outside its angular range."},{"id":"B","text":"Selecting only an off-axis diffracted beam while blocking the direct beam is the ordinary BF condition."},{"id":"C","text":"A dark region must be a hole or the lightest material in the specimen."},{"id":"D","text":"Strong scattering out of the accepted beam can make a region dark."}],"answers":["A","D"],"explanation":"A：正确。BF用中心直射束形成亮背景。D：正确。局部电子被散射出接受范围，会减少该处成像计数而变暗。C：错误。暗对比可由厚度、质量散射、衍射或晶格畸变造成，不能只凭明暗定物性。B：错误。该描述属于DF选束。\n\n重点词：bright field（明场）；direct beam（直射束）；scattering contrast（散射对比）\n逻辑链：局部散射增强 → 更多电子离开BF接受范围 → 直射计数减少 → 图像变暗；暗并不自动等于某一种结构。","source":{"file":"TEM","page":"PDF pp.46–49"},"difficulty":"基础"},{"id":"TEM-019","chapter":"TEM · Imaging modes & applications","type":"multiple","prompt":"Which expectations for routine BF-TEM are appropriate?","options":[{"id":"A","text":"If atomic-scale detail is not resolved, increasing displayed magnification alone supplies the missing information."},{"id":"B","text":"A dislocation can appear dark because lattice distortion scatters electrons outside the objective aperture."},{"id":"C","text":"It is useful for overview images and measurements of particle size and shape."},{"id":"D","text":"Its comparatively straightforward alignment makes it useful before choosing a more specialized mode."}],"answers":["B","C","D"],"explanation":"C：正确。BF适合先找区域并观察尺寸、形状。B：正确。位错周围的晶格畸变改变散射，造成明场计数减少。A：错误。放大像素不增加真实分辨能力，需按任务选择HRTEM等模式。D：正确。常规概览与精细结构分析可以构成连续工作流。\n\n重点词：overview（概览）；dislocation（位错）；resolution（分辨能力）\n逻辑链：先用BF定位和测形状 → 根据研究问题选择更合适模式；畸变改变散射 → 电子离开BF光阑 → 位错产生暗对比。","source":{"file":"TEM","page":"PDF pp.48–49,53–54"},"difficulty":"进阶"},{"id":"TEM-020","chapter":"TEM · Imaging modes & applications","type":"multiple","prompt":"A region is bright in dark-field TEM when","options":[{"id":"A","text":"It necessarily has the highest exposed-surface height."},{"id":"B","text":"It contributes strongly to the diffracted beam selected by the objective aperture."},{"id":"C","text":"It necessarily contains the heaviest element, independently of crystal orientation."},{"id":"D","text":"It sends most of its electrons only into the direct beam that is blocked in DF."}],"answers":["B"],"explanation":"B：正确。DF亮区表示对被选衍射方向有强贡献。A：错误。DF不是表面高度图。C：错误。反射选择与取向很重要，不能把亮区直接当成重元素标签。D：错误。被挡住的直射电子不参与DF成像。可通过光阑偏心或合适束倾斜选入所需衍射束。\n\n重点词：dark field（暗场）；diffracted beam（衍射束）；orientation（取向）\n逻辑链：选一束衍射电子并挡直射束 → 只有满足所选散射条件的区域贡献强信号 → 相应区域变亮。","source":{"file":"TEM","page":"PDF pp.46,50"},"difficulty":"基础"},{"id":"TEM-021","chapter":"TEM · Imaging modes & applications","type":"multiple","prompt":"Two precipitates have similar BF appearance, but only one is bright under a chosen DF condition. Which deductions are justified?","options":[{"id":"A","text":"Every crystal belonging to a phase must be bright under any one selected reflection."},{"id":"B","text":"The dark precipitate may fail to satisfy the selected reflection even if it belongs to the same phase."},{"id":"C","text":"Selecting another reflection can change which crystallites are visible."},{"id":"D","text":"Collecting only a fraction of transmitted electrons can give high contrast but weak signal and longer acquisition."}],"answers":["B","C","D"],"explanation":"B、C：正确。DF按特定反射筛选，不同取向晶粒对同一反射的贡献不同。A：错误。DF暗不能直接推出该相不存在。D：正确。选束提高特异性，却丢弃许多电子，存在对比与信号量的取舍。\n\n重点词：selected reflection（所选反射）；phase selectivity（相选择性）；signal intensity（信号强度）\n逻辑链：选择特定反射 → 只显示满足条件的晶粒 → 获得高选择性/对比；被接受电子减少 → 信号变弱、采集更慢。","source":{"file":"TEM","page":"PDF pp.47,50–51"},"difficulty":"进阶"},{"id":"TEM-022","chapter":"TEM · Imaging modes & applications","type":"multiple","prompt":"Which configuration and mechanism describe HRTEM?","options":[{"id":"A","text":"Interference between the accepted electron waves produces phase contrast."},{"id":"B","text":"Only the central direct beam is allowed through the objective aperture, excluding all diffracted beams."},{"id":"C","text":"The direct beam and suitable diffracted beams pass together through the objective aperture."},{"id":"D","text":"The periodic atomic-scale contrast discussed in the lecture is obtained without any dependence on crystalline order."}],"answers":["A","C"],"explanation":"B：错误。只留中心束是BF的基本选束逻辑。C、A：正确。HRTEM让直射与衍射波共同参与相干干涉。D：错误。课件的规则晶格对比依赖晶态，非晶区表现为无规则灰度，不能把两者等同。\n\n重点词：high-resolution TEM（高分辨TEM）；phase contrast（相位对比）；crystalline order（晶体有序性）\n逻辑链：直射波与衍射波共同通过 → 相位差参与干涉 → 晶格产生周期强度对比；非晶结构不能产生同样规则的晶格图。","source":{"file":"TEM","page":"PDF pp.46,52"},"difficulty":"进阶"},{"id":"TEM-023","chapter":"TEM · Imaging modes & applications","type":"multiple","prompt":"Which interpretation of conventional HRTEM avoids overclaiming atomic positions?","options":[{"id":"A","text":"The image can reveal very fine layers and lattice structure, but raw contrast alone does not uniquely locate every atom or interface."},{"id":"B","text":"Changing focus can reverse bright and dark contrast even when the specimen structure has not changed."},{"id":"C","text":"A bright spot is always an atom column, irrespective of the focus setting."},{"id":"D","text":"A contrast reversal necessarily means that atoms have exchanged places."}],"answers":["A","B"],"explanation":"C：错误。传统HRTEM明暗依赖相位传递与调焦，不能简单作固定原子标签。B：正确。课件展示离焦变化导致对比翻转。A：正确。高分辨能力很有用，但不等于无条件的原子定位；课件随后引出像差校正STEM。D：错误。成像条件改变足以改变明暗，未必发生原子迁移。\n\n重点词：defocus（离焦）；contrast reversal（对比翻转）；atomic position（原子位置）\n逻辑链：焦点改变 → 电子波干涉强度改变 → 明暗可翻转；成像对比变化 ≠ 原子位置必然变化。","source":{"file":"TEM","page":"PDF pp.52–54"},"difficulty":"进阶"},{"id":"TEM-024","chapter":"TEM · Imaging modes & applications","type":"multiple","prompt":"A very thin oxide is buried beneath another film. Which plan is appropriate for measuring its thickness with very fine spatial detail?","options":[{"id":"A","text":"Replace the spatial-resolution requirement by increasing only the displayed magnification."},{"id":"B","text":"Assume that a surface SE-SEM image directly exposes the thickness of the covered oxide."},{"id":"C","text":"Prepare an electron-transparent cross-section containing the buried layer and both interfaces."},{"id":"D","text":"Use HRTEM or suitable aberration-corrected STEM after preparing the required cross-section."}],"answers":["C","D"],"explanation":"C、D：正确。老师Tutorial的关键先是几何：埋藏层必须通过截面进入观察方向；然后选择能分辨所需细节的模式。B：错误。表面图不会自动看见被覆盖的内部层厚。A：错误。显示放大不能弥补实际分辨不足。这里考察“目标信息—制样几何—成像模式”匹配，不要求记住题中的具体厚度数值。\n\n重点词：buried layer（埋藏层）；cross-sectional specimen（截面样品）；spatial resolution（空间分辨率）\n逻辑链：先明确要测内部层厚 → 做穿过目标界面的薄截面 → 选足够分辨细节的透射模式 → 测量界面间距。","source":{"file":"TEM; Electron Spectroscopy","page":"TEM PDF pp.15,53,55; Spectroscopy PDF p.7"},"difficulty":"进阶","tutorial":"TEM Tutorial Q1"},{"id":"TEM-025","chapter":"TEM · Integrated reasoning","type":"multiple","prompt":"A composite has bright edges in SE-SEM and a bright inclusion in BSE-SEM. Which comparisons with TEM are justified?","options":[{"id":"A","text":"A BSE-bright region can indicate stronger nuclear scattering associated with heavier elements."},{"id":"B","text":"To interpret a TEM intensity, one should first identify whether direct or diffracted electrons are accepted."},{"id":"C","text":"SE edge brightness can arise from escape geometry even without a change in composition."},{"id":"D","text":"The bright region must have the same physical meaning in SE, BSE, BF-TEM and DF-TEM."}],"answers":["A","B","C"],"explanation":"C：正确。粗糙边缘更有利于SE逃逸，形貌足以造成亮度变化。A：正确。较大核电荷可增强BSE。D：错误。不同模式接受不同物理信号，不存在通用亮度含义。B：正确。BF和DF首先由接受束不同定义，再讨论具体散射机制。\n\n重点词：topographic contrast（形貌对比）；chemical contrast（成分对比）；detector geometry（探测几何）\n逻辑链：先确定模式和所收电子 → 再确定对比来源 → 最后推断样品性质；不能跨设备直接沿用同一“亮=某物性”规则。","source":{"file":"TEM","page":"PDF pp.3,5,9,46–50"},"difficulty":"进阶"},{"id":"TEM-026","chapter":"TEM · Integrated reasoning","type":"multiple","prompt":"Which distinctions are correct when adjusting electron-microscope imaging conditions?","options":[{"id":"A","text":"The thin-specimen geometry in TEM helps limit the bulk-scattering broadening relevant to this comparison."},{"id":"B","text":"Increasing beam current necessarily shortens the electron wavelength."},{"id":"C","text":"Beam current describes electron delivery rate, whereas beam energy describes kinetic energy per electron."},{"id":"D","text":"In bulk SEM, increasing beam energy can enlarge lateral interaction spread even though the wavelength becomes shorter."}],"answers":["A","C","D"],"explanation":"C：正确。电流与单电子动能是不同控制量。B：错误。增加每秒电子数不等于增加每个电子动能。D：正确。短波长收益可能被较大横向作用体积抵消。A：正确。这解释为何不能把块体SEM的电压趋势不加条件套到薄样品TEM。\n\n重点词：beam current（束流）；beam energy（束能）；lateral spreading（横向展宽）\n逻辑链：束能升高 → 波长缩短，同时在块体中作用体积可能扩大；最终分辨能力需同时看波长和样品内横向展宽。","source":{"file":"TEM","page":"PDF pp.6,8,19,24"},"difficulty":"进阶"},{"id":"TEM-027","chapter":"TEM · Integrated reasoning","type":"multiple","prompt":"A wet, uncoatable insulator needs finer structural detail than a light microscope provides. Which choice follows the tutorial logic?","options":[{"id":"A","text":"ESEM can provide a more suitable local specimen environment and help neutralize charging without a conductive coating."},{"id":"B","text":"Conventional high-vacuum TEM can examine the unchanged thick wet sample simply by increasing magnification."},{"id":"C","text":"The required specimen state and the information sought should be considered before ranking instruments only by resolution."},{"id":"D","text":"All electron microscopes have identical preparation requirements once electrons replace light."}],"answers":["A","C"],"explanation":"B：错误。常规TEM仍有电子透明性与真空等制样要求，放大不能消除。A：正确。ESEM允许样品附近有气体，并可通过正离子中和表面负电荷。D：错误。SEM、ESEM和TEM的几何及环境要求不同。C：正确。保持目标状态是方法选择的条件，不应只比最高分辨率。\n\n重点词：environmental SEM（环境扫描电镜）；charging（充电）；specimen state（样品状态）\n逻辑链：样品不能镀膜且需要湿态观察 → 先满足环境与电荷条件 → 选择ESEM等适合方法；最佳分辨率不是唯一标准。","source":{"file":"TEM; SEM","page":"TEM PDF pp.7,16–20; SEM PDF pp.45–47"},"difficulty":"进阶"},{"id":"TEM-028","chapter":"TEM · Diffraction & crystallography","type":"multiple","prompt":"Which structural questions can electron diffraction answer?","options":[{"id":"A","text":"What is the exposed-surface height at every point, directly from diffraction intensity?"},{"id":"B","text":"What lattice spacings are present in the selected region?"},{"id":"C","text":"Which crystal phase is consistent with the observed reflection pattern?"},{"id":"D","text":"Is the selected material single-crystalline, polycrystalline or amorphous?"}],"answers":["B","C","D"],"explanation":"B、C、D：正确。老师Tutorial列出的核心结构信息包括间距、晶相，以及单晶/多晶/非晶状态。需要把图样的几何、允许反射和锐斑/锐环/弥散特征结合起来。A：错误。衍射不是表面高度图；形状尺寸可看实空间像，结构周期看衍射，两者互补。\n\n重点词：lattice spacing（晶面间距）；crystal phase（晶相）；crystallinity（结晶状态）\n逻辑链：选定区域 → 测衍射位置及形态 → 判断周期/晶相/有序性；实空间形状与倒易空间结构回答不同问题。","source":{"file":"TEM; Electron Spectroscopy","page":"TEM PDF pp.32,39–41,55; Spectroscopy PDF p.8"},"difficulty":"进阶","tutorial":"TEM Tutorial Q2"},{"id":"TEM-029","chapter":"TEM · Integrated reasoning","type":"multiple","prompt":"A particle looks dark in BF-TEM. Which additional observations help test the cause rather than assuming a unique composition?","options":[{"id":"A","text":"Selecting a suitable diffracted beam can test whether diffraction contributes to the contrast."},{"id":"B","text":"Comparing the particle across suitable imaging conditions can reveal that contrast is condition-dependent."},{"id":"C","text":"Distortion around a dislocation can alter scattering even without a separate chemical phase."},{"id":"D","text":"The BF intensity alone establishes the exact element, so no other signal is useful."}],"answers":["A","B","C"],"explanation":"A：正确。改变选束可检查衍射贡献，而不是把单张BF暗区唯一化解释。B：正确。同一区域随模式或成像条件变化的对比有助于约束解释。D：错误。结构强度对比不等于唯一元素指纹，化学问题通常还需相应谱学。C：正确。位错示例说明局部畸变也能造成BF暗对比。\n\n重点词：diffraction contrast（衍射对比）；lattice distortion（晶格畸变）；complementary evidence（互补证据）\n逻辑链：观察到暗区 → 提出散射/衍射等候选原因 → 改变选束并结合结构证据 → 排除把亮度直接等同元素的过度推断。","source":{"file":"TEM; Electron Spectroscopy","page":"TEM PDF pp.47–53; Spectroscopy PDF pp.14–17"},"difficulty":"进阶"},{"id":"TEM-030","chapter":"TEM · Principles & applications","type":"multiple","prompt":"Which statements guide an in-situ TEM study of a structural change during heating?","options":[{"id":"A","text":"A changing HRTEM intensity always proves atomic motion even if focus and imaging conditions also changed."},{"id":"B","text":"BF imaging and local diffraction can provide complementary changes in shape and crystal structure."},{"id":"C","text":"A suitable holder is needed to control the stimulus while retaining a usable electron-transparent observation region."},{"id":"D","text":"The observed sequence should be interpreted with awareness that illumination and imaging conditions can affect what is seen."}],"answers":["B","C","D"],"explanation":"C：正确。原位实验不是只把普通样品放进仪器，还需适合加热等条件的样品杆并保持透射几何。B：正确。实空间像跟踪形状，衍射跟踪局部结构，可联合判断。A：错误。离焦造成的对比翻转也会改变强度，必须控制成像条件。D：正确。课件示例既强调原位动态，也展示照射诱导结构变化，需区分真实样品演化和测量影响。\n\n重点词：in-situ heating（原位加热）；controlled conditions（受控条件）；structural evolution（结构演化）\n逻辑链：控制加热与成像条件 → 连续观察同一区域 → 联合形状和衍射变化 → 判断结构演化，同时排除离焦或照射效应。","source":{"file":"TEM","page":"PDF pp.15,22,41,53–54"},"difficulty":"进阶"},{"id":"TEM-031","chapter":"TEM · Tutorial applications","type":"multiple","prompt":"A diffraction pattern is collected from a precipitate together with surrounding matrix. Which steps help establish which structure the pattern represents?","options":[{"id":"A","text":"A pattern with many spots proves that the precipitate itself contains many crystal orientations, even when matrix is included."},{"id":"B","text":"Selecting a diffraction spot with the objective aperture automatically restricts the contributing specimen to the precipitate."},{"id":"C","text":"Restrict the contributing specimen region with the selected-area aperture when the geometry allows."},{"id":"D","text":"Check the sampled region before assigning every observed reflection to the precipitate."}],"answers":["C","D"],"explanation":"C 对：选区光阑限制参与衍射的样品区域，可以帮助减少周围基体的贡献；是否能完全隔离目标仍受实际几何限制。\nB 错：物镜光阑选择衍射束，决定哪些束参与成像，不等于选择样品中的位置。\nD 对：图样必须与被取样的区域对应，混合区域可能同时包含不同结构的贡献。\nA 错：当基体也参与时，不能把所有斑点和取向都归给析出物本身。\n\n重点词：selected-area aperture（选区光阑）；objective aperture（物镜光阑）；sampling region（取样区域）。\n逻辑链：先确认哪些样品区域贡献信号 → 再把反射与局部结构关联 → 避免把混合图样误判成单个目标的结构。","source":{"file":"TEM","page":"PDF pp. 35, 39–44"},"difficulty":"进阶","batch":"新增应用题"},{"id":"TEM-032","chapter":"TEM · Tutorial applications","type":"multiple","prompt":"A failed device requires both exposed-surface texture and the structure of a particular buried interface to be examined. Which plan is justified?","options":[{"id":"A","text":"Use suitable SE-SEM imaging to examine surface morphology."},{"id":"B","text":"Site-specific FIB preparation is useful when the cross-section must contain the selected failure location."},{"id":"C","text":"The higher resolution of TEM makes its transmission image a direct replacement for any surface-topography measurement."},{"id":"D","text":"Use a suitable electron-transparent cross-section to examine the buried interface in TEM."}],"answers":["A","B","D"],"explanation":"A 对：SE形貌对比适合回答暴露表面的纹理问题。\nD 对：TEM看穿薄样品，截面可使埋藏界面进入观察方向，回答内部结构问题。\nC 错：分辨率高不表示信息类型相同；透射投影不直接等价于表面高度或形貌图。\nB 对：老师Tutorial强调，FIB的价值在于让薄片包含指定的局部目标，而非因为任何TEM样品都必须使用FIB。\n\n重点词：surface topography（表面形貌）；cross-section（截面）；site-specific preparation（位点特异制样）。\n逻辑链：把表面与埋藏结构分成不同信息需求 → 分别匹配SE形貌信号和TEM透射截面 → 需要指定局部区域时再采用FIB。","source":{"file":"TEM","page":"PDF pp. 2–3, 15–18, 20–21, 54–55"},"difficulty":"进阶","batch":"新增应用题"},{"id":"TEM-033","chapter":"TEM · Tutorial applications","type":"multiple","prompt":"A small electron source provides good directional coherence, but the acceleration conditions become unstable during phase imaging. Which conclusion is justified?","options":[{"id":"A","text":"Changes in acceleration potential affect only electron delivery rate and not the electron energies."},{"id":"B","text":"Variations in electron energy can impair temporal coherence even when directional coherence remains good."},{"id":"C","text":"Good spatial coherence guarantees that temporal coherence remains unaffected."},{"id":"D","text":"The selected-area aperture selects electron energies and therefore removes the acceleration instability."}],"answers":["B"],"explanation":"C 错：空间相干性与时间相干性是不同条件，不能由前者自动保证后者。\nB 对：固定加速条件帮助保持电子能量与波的时间相干；能量变化仍可能影响相位成像，即使电子方向较一致。\nA 错：加速电势影响单个电子的动能，不能把它仅当成控制电子数目的束流。\nD 错：选区光阑限制样品区域，不是能量选择器，也不会修复加速条件不稳定。\n\n重点词：spatial coherence（空间相干性）；temporal coherence（时间相干性）；acceleration stability（加速稳定性）。\n逻辑链：小源有利于方向一致，加速稳定有利于能量一致 → 两种相干条件应分别判断 → 相位成像不能只检查一个条件。","source":{"file":"TEM","page":"PDF pp. 24–26, 42–44"},"difficulty":"进阶","batch":"新增应用题"},{"id":"TEM-034","chapter":"TEM · Tutorial applications","type":"multiple","prompt":"A useful BF overview is obtained, but selecting a DF reflection gives a weak image. Which assessments are reasonable?","options":[{"id":"A","text":"A longer acquisition may help collect the DF signal, provided specimen changes during observation are considered."},{"id":"B","text":"Weakness or darkness under one selected reflection does not by itself establish that the target crystal phase is absent."},{"id":"C","text":"Returning to BF can help verify the specimen area and shape without giving exactly the same reflection-selective information as DF."},{"id":"D","text":"Collecting only a fraction of the transmitted electrons can make DF intrinsically weaker than the overview."}],"answers":["A","B","C","D"],"explanation":"D 对：DF只接受所选衍射束的一部分电子，信号弱可来自收集条件，而非仪器或样品一定出了问题。\nA 对：课件将较长采集列为弱DF信号的代价；同时应注意照射和观察时间可能带来的样品变化。\nC 对：BF适合概览、尺寸与形状，DF则提供反射选择下的晶体学对比，两者可互补使用。\nB 对：同一晶相的不同取向不一定都满足当前选定反射，单张弱或暗的DF像不足以证明该相不存在。\n\n重点词：signal collection（信号收集）；selected reflection（选定反射）；acquisition trade-off（采集取舍）。\n逻辑链：选束提高选择性但减少被收集电子 → 需要在信号、采集时间与样品稳定性之间取舍 → 先检查成像条件，再判断结构是否存在。","source":{"file":"TEM","page":"PDF pp. 41, 48, 50–51"},"difficulty":"进阶","batch":"新增应用题"},{"id":"SPEC-001","chapter":"Electron Spectroscopy","type":"multiple","prompt":"Which statements correctly connect electron–matter signals with local chemical analysis?","options":[{"id":"A","text":"EDS and EDX denote the same technique and can provide point spectra, line scans and elemental maps."},{"id":"B","text":"Returning beam electrons, emitted photons and absorbed-electron specimen current are different possible signals; EDS and WDS analyse the X-ray-photon branch."},{"id":"C","text":"BSE brightness alone uniquely identifies every element in an unknown specimen."},{"id":"D","text":"Overlaying elemental maps with an SE image can connect local composition with surface morphology."}],"answers":["A","B","D"],"explanation":"C 错误：BSE提供与散射能力等因素有关的相对成分反差，亮度不能唯一确定元素身份。\nA 正确：EDS与EDX是同一技术的不同缩写；点、线、面测量回答不同空间范围的组分问题。\nD 正确：SE提供形貌，元素图提供组分分布，二者叠加可建立结构与化学的联系。\nB 正确：课件区分返回的BSE、发射的光子及吸收电子形成的样品电流；阴极发光和X射线均属光子分支，但所测光谱范围不同，不能把这些信号混成同一种。\n\n重点词：backscattered electrons（背散射电子）；elemental mapping（元素成像）；topography（形貌）。\n逻辑链：电子束与样品相互作用 → 产生不同信号 → 按信号选择探测器 → 分别回答形貌、相对成分或元素身份。","source":{"file":"Electron Spectroscopy","page":"PDF pp. 13, 14, 15, 16, 17"},"difficulty":"基础"},{"id":"SPEC-002","chapter":"Electron Spectroscopy","type":"multiple","prompt":"Which statements correctly describe characteristic X-ray production?","options":[{"id":"A","text":"XRF uses incident X-rays, whereas EDS and WDS use energetic electrons to initiate core-level excitation."},{"id":"B","text":"Only allowed transitions occur; Kα and Kβ both end in the K shell but originate from different higher shells."},{"id":"C","text":"One element can produce several characteristic lines because several allowed core-level transitions are possible."},{"id":"D","text":"XRF and EDS use the same incident excitation beam because they can measure the same characteristic X-rays."}],"answers":["A","B","C"],"explanation":"D 错误：相同发射线不代表激发源相同；XRF由X射线激发，EDS/WDS由电子束激发。\nA 正确：两者都能产生内层空穴，随后弛豫发出特征X射线。\nC 正确：不同允许跃迁有不同能级差，因此峰数不能直接等于元素数；跃迁还受选择规则限制。\nB 正确：K表示接受电子的最终壳层，α和β区分较高壳层的跃迁来源。\n\n重点词：core hole（内层空穴）；characteristic X-ray（特征X射线）；selection rule（选择规则）。\n逻辑链：足够能量的入射辐射 → 内层电子被激发并留下空穴 → 高壳层电子填补 → 能级差形成元素特征光子。","source":{"file":"Electron Spectroscopy","page":"PDF pp. 18, 19"},"difficulty":"基础"},{"id":"SPEC-003","chapter":"Electron Spectroscopy","type":"multiple","prompt":"An automatic EDS fit gives an unlikely element and leaves a weak shoulder unexplained. Which actions are justified?","options":[{"id":"A","text":"Check candidate line assignments against plausible sample chemistry and other lines from the same element."},{"id":"B","text":"Treat every visible feature as a separate element without checking whether one element has several lines."},{"id":"C","text":"Accept the automatic assignment unchanged because software cannot confuse overlapping lines."},{"id":"D","text":"Check peak identification and background treatment before fitting peak contributions and quantifying composition."}],"answers":["A","D"],"explanation":"A 正确：谱线可能重叠，也可能有漏掉的弱峰；应结合样品背景与同元素多条谱线核对。\nC 错误：课件明确展示软件误认和漏峰，人工核查是必要环节。\nB 错误：单元素可产生多条线，多个元素也可叠成一个宽峰，不能按峰数直接数元素。\nD 正确：鉴别错误会传递到拟合和定量；处理流程应先解决信号归属与本底。\n\n重点词：peak identification（峰鉴别）；overlap（重叠）；background subtraction（背景扣除）。\n逻辑链：观察到宽峰或肩峰 → 检查可能的重叠与弱线 → 扣除连续背景并合理拟合 → 再进行元素定量。","source":{"file":"Electron Spectroscopy","page":"PDF pp. 20, 21, 22"},"difficulty":"进阶"},{"id":"SPEC-004","chapter":"Electron Spectroscopy","type":"multiple","prompt":"Which statements explain the broad background beneath EDS characteristic peaks?","options":[{"id":"A","text":"Fast-electron deflection and deceleration in nuclear electric fields can emit a continuum of X-ray energies."},{"id":"B","text":"The highest possible continuum photon energy is independent of the incident electron energy."},{"id":"C","text":"The maximum of a smooth continuum is an element-specific line that identifies the same element in every sample."},{"id":"D","text":"Reabsorption can suppress the low-energy part, so the detected continuum differs from the initially emitted continuum."}],"answers":["A","D"],"explanation":"A 正确：电子以不同程度损失能量，产生连续能量分布的制动辐射，而非单一离散跃迁线。\nD 正确：部分光子在逸出前被样品吸收，因而测到的连续谱形还含传播与吸收效应。\nC 错误：连续背景不是元素特征线，其宽峰顶不能直接当作元素指纹。\nB 错误：光子能量来自入射电子，改变束能也会改变连续谱的能量上限。\n\n重点词：Bremsstrahlung（制动辐射）；continuum（连续谱）；reabsorption（再吸收）。\n逻辑链：快电子在核电场中偏转并损失不同能量 → 发出连续X射线 → 低能光子更易被吸收 → 形成探测到的本底。","source":{"file":"Electron Spectroscopy","page":"PDF pp. 23, 42"},"difficulty":"基础"},{"id":"SPEC-005","chapter":"Electron Spectroscopy","type":"multiple","prompt":"Why is a weak EDS peak not sufficient evidence that an element has a low concentration?","options":[{"id":"A","text":"Light elements can give weak signals and less reliable quantification even when they are present."},{"id":"B","text":"A weak or absent peak always proves that the element is absent."},{"id":"C","text":"Different elements and different shell transitions can have different fluorescence yields."},{"id":"D","text":"Peak fitting removes all differences in elemental X-ray generation efficiency."}],"answers":["A","C"],"explanation":"D 错误：拟合可减少噪声影响，但不能自动消除不同元素或线系的物理响应差异。\nC 正确：每次电离产生X射线的概率不相同，同一元素不同壳层的线也不能直接按原始峰高比较。\nA 正确：课件用轻元素可用壳层较少、辐射跃迁通道有限说明其低荧光产额；弱响应使定量更困难。\nB 错误：低产额、吸收、重叠或激发不足都可让元素信号不明显。\n\n重点词：fluorescence yield（荧光产额）；core ionization（内层电离）；detection limit（检测限）。\n逻辑链：电离机会相近不代表发光效率相同 → 不同产额产生不同峰强 → 弱峰不能直接等同于低浓度 → 定量前必须校正。","source":{"file":"Electron Spectroscopy","page":"PDF pp. 24, 27"},"difficulty":"基础"},{"id":"SPEC-006","chapter":"Electron Spectroscopy","type":"multiple","prompt":"A bulk SEM-EDS measurement is repeated at higher beam energy. Which interpretations are justified?","options":[{"id":"A","text":"Higher beam energy can enlarge the interaction volume and the lateral region contributing X-rays."},{"id":"B","text":"The chemical sampling region must become smaller whenever the nominal surface probe remains unchanged."},{"id":"C","text":"X-rays generated inside the sample may be reabsorbed along their exit paths."},{"id":"D","text":"Quantification corrections must consider specimen response and measurement geometry, not concentration alone."}],"answers":["A","C","D"],"explanation":"B 错误：表面探针直径不等于整个X射线产生体积的横向范围。\nA 正确：较高束能通常使块体中的电子轨迹更深、更广，局部化学测量会混合更大范围的信息。\nC 正确：生成深度及离开样品的路径影响吸收，因此探测谱不同于全部发射谱。\nD 正确：本课ZAF方法将原子序数、吸收、荧光产额等与束能、探测几何一起纳入校正。\n\n重点词：interaction volume（相互作用体积）；absorption（吸收）；ZAF correction（ZAF校正）。\n逻辑链：束能影响电子在样品中的传播 → 改变X射线生成范围与逸出路径 → 同时影响空间定位和峰强 → 不能只改束能而忽略定量条件。","source":{"file":"Electron Spectroscopy","page":"PDF pp. 25, 26"},"difficulty":"进阶"},{"id":"SPEC-007","chapter":"Electron Spectroscopy","type":"multiple","prompt":"How should a quantitative composition be obtained from the EDS peaks of a two-element specimen?","options":[{"id":"A","text":"Use one universal correction factor for every detector geometry and every sample material."},{"id":"B","text":"Use the assumption that the concentrations of the included elements sum to the whole specimen."},{"id":"C","text":"Correct the relative peak intensities for the different elemental responses before interpreting a concentration ratio."},{"id":"D","text":"Normalize the two uncorrected peak heights and regard the result as exact composition."}],"answers":["B","C"],"explanation":"C 正确：课件中的校正因子把强度比转换为浓度比，二者不能直接混用。\nD 错误：只归一化原始峰高仍保留产额、吸收等偏差。\nB 正确：比例给相对关系，二元组分和的归一化条件才确定各自份额；前提是二元模型确实适用。\nA 错误：因子包含样品与测量条件，不能当作与仪器和材料无关的通用常量。\n\n重点词：intensity ratio（强度比）；concentration ratio（浓度比）；normalization（归一化）。\n逻辑链：原始峰强 → 按元素与测量条件校正 → 得到浓度比例 → 在正确的组分模型下归一化。","source":{"file":"Electron Spectroscopy","page":"PDF pp. 26"},"difficulty":"进阶"},{"id":"SPEC-008","chapter":"Electron Spectroscopy","type":"multiple","prompt":"An EDS analysis initially assumes two elements, but a third element is then identified. Which changes are necessary?","options":[{"id":"A","text":"Include the third element in the composition model and in the total concentration used for normalization."},{"id":"B","text":"Keep the original two elements normalized to the whole sample and add the third concentration afterwards."},{"id":"C","text":"Use enough corrected relative-intensity information to determine the concentrations of all included elements."},{"id":"D","text":"Assume that adding another element makes absorption and fluorescence-yield corrections unnecessary."}],"answers":["A","C"],"explanation":"B 错误：若先把两元素占满总组分，再额外添加第三元素，会造成模型不自洽。\nA 正确：归一化范围必须覆盖所采用模型中的全部组分。\nD 错误：多元素只是扩展模型，元素响应及基体影响并不会消失。\nC 正确：需要足够的独立校正关系，再结合总组分条件，不能仅凭一个原始峰比确定所有份额。\n\n重点词：multielement analysis（多元素分析）；matrix effects（基体效应）；normalization（归一化）。\n逻辑链：识别出额外元素 → 更新组分模型及相关校正关系 → 对全部组分统一归一化 → 避免遗漏组分造成系统性偏差。","source":{"file":"Electron Spectroscopy","page":"PDF pp. 27"},"difficulty":"进阶"},{"id":"SPEC-009","chapter":"Electron Spectroscopy","type":"multiple","prompt":"A multiphase alloy has bright and dark regions in a BSE image. Which approach supports a reliable composition comparison?","options":[{"id":"A","text":"Measure EDS spectra at several representative grains in each region rather than relying on brightness alone."},{"id":"B","text":"Assign an exact elemental composition directly from the BSE brightness of one grain."},{"id":"C","text":"Check reproducibility before using an average or median to summarize a measurement series."},{"id":"D","text":"Treat one point spectrum as proof that the entire alloy has a uniform composition."}],"answers":["A","C"],"explanation":"A 正确：BSE反差可引导选点，但元素身份和组分差异应由局部能谱核实，多晶粒测量更具代表性。\nB 错误：亮度是相对散射反差，不能直接给出精确组成。\nC 正确：课件强调不同晶粒的重复结果可重复时再取平均或中位数。\nD 错误：单点只反映对应采样区域，不能自动代表所有相和整块样品。\n\n重点词：representative sampling（代表性取样）；reproducibility（可重复性）；local composition（局部组分）。\n逻辑链：BSE发现不同区域 → 在各相进行多点EDS验证 → 检查结果是否可重复 → 再总结相之间的可靠组分差异。","source":{"file":"Electron Spectroscopy","page":"PDF pp. 28"},"difficulty":"进阶"},{"id":"SPEC-010","chapter":"Electron Spectroscopy","type":"multiple","prompt":"How does a silicon drift detector determine the energy of an incoming X-ray?","options":[{"id":"A","text":"The central anode and electronic readout convert the collected charge into an energy-related pulse."},{"id":"B","text":"Every X-ray produces the same collected charge, so pulse height contains no energy information."},{"id":"C","text":"The photon deposits energy and produces electron–hole pairs in the silicon crystal."},{"id":"D","text":"The generated charge is related to photon energy and is collected using an applied electric field."}],"answers":["A","C","D"],"explanation":"C 正确：X射线在硅晶体中沉积能量并产生电子–空穴对。\nD 正确：能量越大产生的载流子越多，偏置电场使电子漂移至阳极。\nA 正确：中央阳极及FET等读出电路测电荷，脉冲幅度携带能量信息。\nB 错误：若每个事件电荷都相同，就不能由脉冲幅度进行能量色散。\n\n重点词：electron–hole pair（电子–空穴对）；drift（漂移）；pulse height（脉冲幅度）。\n逻辑链：光子沉积能量 → 产生对应数量载流子 → 电场收集电荷 → 脉冲幅度转换为X射线能量。","source":{"file":"Electron Spectroscopy","page":"PDF pp. 30"},"difficulty":"基础"},{"id":"SPEC-011","chapter":"Electron Spectroscopy","type":"multiple","prompt":"A high EDS count rate causes pulse pile-up. Which responses follow the detector principle?","options":[{"id":"A","text":"Reduce an excessive beam current to lower the photon arrival rate and the probability of overlapping pulses."},{"id":"B","text":"Increase beam current to eliminate detector dead time by increasing each electron’s
